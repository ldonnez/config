---
- name: Cleanup
  hosts: localhost
  connection: local
  tasks:
    - name: Remove controller-side secrets fixtures
      ansible.builtin.file:
        path: /tmp/secrets-controller-fixture
        state: absent

    - name: Remove controller-side mutt alias fixture
      ansible.builtin.file:
        path: /tmp/secrets/mutt-alias
        state: absent
