---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: debian13
    image: molecule:debian13
    pre_build_image: true
    privileged: true
    override_command: false
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ANSIBLE_VAULT_PASSWORD_FILE: ${MOLECULE_SCENARIO_DIRECTORY}/.vault-pass
  inventory:
    group_vars:
      all:
        ansible_user: molecule

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
