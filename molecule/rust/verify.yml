---
- name: Verify
  hosts: all
  vars:
    cargo_bin: "{{ ansible_facts.user_dir }}/.cargo/bin"
  tasks:
    - name: Check that rustup, cargo and rustc exist
      ansible.builtin.stat:
        path: "{{ cargo_bin }}/{{ item }}"
      loop:
        - rustup
        - cargo
        - rustc
      register: rust_binaries

    - name: Read the rustup version
      ansible.builtin.command:
        cmd: "{{ cargo_bin }}/rustup --version"
      register: rustup_version
      changed_when: false

    - name: Read the cargo version
      ansible.builtin.command:
        cmd: "{{ cargo_bin }}/cargo --version"
      register: cargo_version
      changed_when: false

    - name: Read the rustc version
      ansible.builtin.command:
        cmd: "{{ cargo_bin }}/rustc --version"
      register: rustc_version
      changed_when: false

    - name: Read the active rust toolchain
      ansible.builtin.command:
        cmd: "{{ cargo_bin }}/rustup show active-toolchain"
      register: rust_toolchain
      changed_when: false

    - name: Assert the rust role installed a working Rust toolchain
      ansible.builtin.assert:
        that:
          - rust_binaries.results | selectattr('stat.exists') | list | length == 3
          - rustup_version.stdout is search('rustup')
          - cargo_version.stdout is search('cargo')
          - rustc_version.stdout is search('rustc')
          - rust_toolchain.stdout is search('stable')
        fail_msg: "The rust role did not install a working Rust toolchain in {{ cargo_bin }}"
        success_msg: "The rust role installed a working Rust toolchain in {{ cargo_bin }}"
