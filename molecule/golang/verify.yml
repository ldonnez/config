---
- name: Verify
  hosts: all
  vars:
    go_bin: /usr/local/go/bin/go
  tasks:
    - name: Check that the Go binary exists
      ansible.builtin.stat:
        path: "{{ go_bin }}"
      register: go_binary

    - name: Read the Go version
      ansible.builtin.command:
        cmd: "{{ go_bin }} version"
      register: go_version
      changed_when: false

    - name: Read the Go root
      ansible.builtin.command:
        cmd: "{{ go_bin }} env GOROOT"
      register: go_root
      changed_when: false

    - name: Write a small Go program
      ansible.builtin.copy:
        content: |
          package main

          import "fmt"

          func main() {
              fmt.Println("hello from go")
          }
        dest: /tmp/hello.go
        mode: "0644"

    - name: Run the Go program
      ansible.builtin.command:
        cmd: "{{ go_bin }} run /tmp/hello.go"
      register: go_run
      changed_when: false

    - name: Assert the golang role installed a working Go toolchain
      ansible.builtin.assert:
        that:
          - go_binary.stat.exists
          - go_version.stdout is search('go1[.]')
          - go_root.stdout == '/usr/local/go'
          - go_run.stdout == 'hello from go'
        fail_msg: "The golang role did not install a working Go toolchain"
        success_msg: "The golang role installed a working Go toolchain"
