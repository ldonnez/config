---
- name: Verify
  hosts: all
  vars_files:
    - ../../roles/dotfiles/defaults/main.yml
  tasks:
    - name: Check for vim.basic
      ansible.builtin.stat:
        path: /usr/bin/vim.basic
      register: vim_basic

    - name: Check vim binary
      ansible.builtin.command:
        argv:
          - "{{ "{{" }} '/usr/bin/vim.basic' if vim_basic.stat.exists else 'vim' {{ "}}" }}"
          - --version
      register: vim_version
      changed_when: false

    - name: Assert vim is installed
      ansible.builtin.assert:
        that:
          - vim_version.rc == 0
          - vim_version.stdout is search('VIM - Vi IMproved|Vi IMproved')
        fail_msg: "vim is not installed or does not report a version"
        success_msg: "vim is installed"

    - name: Check vim symlinks
      ansible.builtin.stat:
        path: "{{ "{{" }} item.path {{ "}}" }}"
        follow: false
      loop:
        - { path: "{{ "{{" }} ansible_facts.user_dir {{ "}}" }}/.vimrc", src: "{{ "{{" }} dotfiles_directory_path {{ "}}" }}/.vimrc" }
        - { path: "{{ "{{" }} ansible_facts.user_dir {{ "}}" }}/.gvimrc", src: "{{ "{{" }} dotfiles_directory_path {{ "}}" }}/.gvimrc" }
        - { path: "{{ "{{" }} ansible_facts.user_dir {{ "}}" }}/.vim/coc-settings.json", src: "{{ "{{" }} dotfiles_directory_path {{ "}}" }}/.vim/coc-settings.json" }
      register: vim_links

    - name: Assert vim config symlinks
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
          - item.stat.lnk_source == item.item.src
        fail_msg: "Expected {{ "{{" }} item.item.path {{ "}}" }} to symlink to {{ "{{" }} item.item.src {{ "}}" }}"
        success_msg: "Vim config symlink is correct"
      loop: "{{ "{{" }} vim_links.results {{ "}}" }}"
      loop_control:
        label: "{{ "{{" }} item.item.path {{ "}}" }}"

    - name: Check vim-plug and plugins
      ansible.builtin.stat:
        path: "{{ "{{" }} item {{ "}}" }}"
      loop:
        - "{{ "{{" }} ansible_facts.user_dir {{ "}}" }}/.vim/autoload/plug.vim"
        - "{{ "{{" }} ansible_facts.user_dir {{ "}}" }}/.vim/plugged/vim-fugitive"
        - "{{ "{{" }} ansible_facts.user_dir {{ "}}" }}/.vim/plugged/fzf.vim"
      register: vim_plugin_paths

    - name: Assert vim-plug and plugins are installed
      ansible.builtin.assert:
        that:
          - vim_plugin_paths.results | selectattr('stat.exists') | list | length == vim_plugin_paths.results | length
        fail_msg: "Expected vim-plug and plugins to be installed"
        success_msg: "vim-plug and plugins are installed"
