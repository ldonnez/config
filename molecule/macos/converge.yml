---
- name: Prevent running the macOS Molecule scenario outside CI
  hosts: localhost
  connection: local
  tasks:
    - name: Assert the macOS Molecule scenario is running in CI
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'CI') | bool
        fail_msg: >-
          The macOS Molecule scenario modifies the current user's home directory
          and is only safe to run in CI.
      tags: always

- name: Run selected macOS setup roles
  ansible.builtin.import_playbook: ../../setup_macos.yml
  vars:
    secrets_directory: /tmp/molecule-macos/secrets
    secrets_repository: file:///tmp/molecule-macos/secrets-fixture
    ssh_backup_dir: /tmp/molecule-macos/secrets/.ssh
    gnupg_backup_dir: /tmp/molecule-macos/secrets
    gnupg_gpg_key_ids:
      - molecule@example.com
    mas_apps: []
