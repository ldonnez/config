---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: ubuntu2404
    image: molecule:ubuntu2404
    pre_build_image: true
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: ubuntu2604
    image: molecule:ubuntu2604
    pre_build_image: true
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    host_vars:
      ubuntu2404:
        ansible_user: molecule
      ubuntu2604:
        ansible_user: molecule

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
