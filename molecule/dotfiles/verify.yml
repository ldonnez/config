---
- name: Verify
  hosts: all
  vars_files:
    - ../../roles/dotfiles/defaults/main.yml
  tasks:
    - name: Check that the dotfiles directory exists
      ansible.builtin.stat:
        path: "{{ dotfiles_directory_path }}"
      register: dotfiles_directory

    - name: Check that the dotfiles directory is a Git repository
      ansible.builtin.stat:
        path: "{{ dotfiles_directory_path }}/.git"
      register: dotfiles_git_directory

    - name: Read the remote URL of the cloned repository
      ansible.builtin.command:
        cmd: git -C {{ dotfiles_directory_path }} remote get-url origin
      register: dotfiles_remote_url
      changed_when: false
      # noqa: command-instead-of-module

    - name: Read the checked out commit
      ansible.builtin.command:
        cmd: git -C {{ dotfiles_directory_path }} rev-parse --verify HEAD
      register: dotfiles_commit
      changed_when: false
      # noqa: command-instead-of-module

    - name: Assert the dotfiles role cloned the repository
      ansible.builtin.assert:
        that:
          - dotfiles_directory.stat.isdir | default(false)
          - dotfiles_git_directory.stat.isdir | default(false)
          - dotfiles_remote_url.stdout == dotfiles_repo
          - dotfiles_commit.stdout | length > 0
        fail_msg: "Dotfiles role did not clone {{ dotfiles_repo }} into {{ dotfiles_directory_path }}"
        success_msg: "Dotfiles role cloned {{ dotfiles_repo }} into {{ dotfiles_directory_path }}"
