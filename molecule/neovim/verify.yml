---
- name: Verify
  hosts: all
  vars_files:
    - ../../roles/dotfiles/defaults/main.yml
    - ../../roles/neovim/defaults/main.yml
  tasks:
    - name: Check neovim binary
      ansible.builtin.command:
        cmd: nvim --version
      register: nvim_version
      changed_when: false

    - name: Assert neovim is installed
      ansible.builtin.assert:
        that:
          - nvim_version.rc == 0
          - nvim_version.stdout is search('NVIM')
        fail_msg: "Neovim is not installed or does not report a version"
        success_msg: "Neovim is installed"

    - name: Check neovim config symlink
      ansible.builtin.stat:
        path: "{{ neovim_config_dir }}"
        follow: false
      register: nvim_config

    - name: Check neovim config source in dotfiles
      ansible.builtin.stat:
        path: "{{ neovim_dotfiles_path }}"
      register: nvim_config_source

    - name: Assert neovim config is symlinked
      ansible.builtin.assert:
        that:
          - nvim_config.stat.exists
          - nvim_config.stat.islnk
          - nvim_config.stat.lnk_source == neovim_dotfiles_path
          - nvim_config_source.stat.exists
        fail_msg: "Expected {{ neovim_config_dir }} to symlink to {{ neovim_dotfiles_path }}"
        success_msg: "Neovim config is symlinked"

    - name: Check spell files
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.local/share/nvim/site/spell/{{ item }}"
      loop:
        - nl.utf-8.spl
        - nl.utf-8.sug
      register: nvim_spell_files

    - name: Assert spell files are installed
      ansible.builtin.assert:
        that:
          - nvim_spell_files.results | selectattr('stat.exists') | list | length == 2
        fail_msg: "Expected Dutch spell files to be installed"
        success_msg: "Dutch spell files are installed"

    - name: Check neovim pack lock file
      ansible.builtin.stat:
        path: "{{ neovim_config_dir }}/nvim-pack-lock.json"
      register: nvim_pack_lock

    - name: Read expected neovim plugins from lock file
      ansible.builtin.slurp:
        src: "{{ neovim_config_dir }}/nvim-pack-lock.json"
      register: nvim_pack_lock_content

    - name: List installed neovim plugins
      ansible.builtin.command:
        argv:
          - nvim
          - --headless
          - "+lua for _, p in ipairs(vim.pack.get()) do io.write(p.spec.name .. '\\n') end"
          - +qa
      register: nvim_installed_plugins
      changed_when: false

    - name: Assert neovim plugins are installed
      ansible.builtin.assert:
        that:
          - nvim_pack_lock.stat.exists
          - nvim_installed_plugins.rc == 0
          - >-
            ((nvim_pack_lock_content.content | b64decode | from_json).plugins.keys() | list | difference(nvim_installed_plugins.stdout_lines)) | length == 0
        fail_msg: >-
          Missing neovim plugins:
          {{ (nvim_pack_lock_content.content | b64decode | from_json).plugins.keys() | list | difference(nvim_installed_plugins.stdout_lines) }}
        success_msg: "Neovim plugins from nvim-pack-lock.json are installed"
