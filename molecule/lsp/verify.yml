---
- name: Verify
  hosts: all
  vars_files:
    - ../../roles/lsp/defaults/main.yml
  vars:
    npm_prefix: "{{ ansible_facts.user_dir }}/.npm"
    npm_path: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"

  tasks:
    - name: Read the configured npm prefix
      ansible.builtin.command:
        cmd: npm config get prefix
      register: npm_configured_prefix
      changed_when: false
      environment:
        PATH: "{{ npm_path }}"

    - name: List global npm packages
      ansible.builtin.command:
        cmd: npm ls -g --depth=0 --json
      register: npm_global_packages
      changed_when: false
      environment:
        PATH: "{{ npm_path }}"

    - name: Assert npm LSP servers are installed in the npm prefix
      ansible.builtin.assert:
        that:
          - npm_configured_prefix.stdout == npm_prefix
          - lsp_npm | difference((npm_global_packages.stdout | from_json).get('dependencies', {}).keys() | list) | length == 0
        fail_msg: >-
          Expected npm LSP packages {{ lsp_npm | difference((npm_global_packages.stdout | from_json).get('dependencies', {}).keys() | list) }}
          to be installed in {{ npm_prefix }}
        success_msg: "All npm LSP packages are installed in {{ npm_prefix }}"
      when: lsp_npm | length > 0

    - name: Check cargo-installed LSP package
      ansible.builtin.command:
        cmd: "{{ ansible_facts.user_dir }}/.cargo/bin/stylua --version"
      register: stylua_version
      changed_when: false
      when: lsp_cargo | length > 0

    - name: Assert cargo-installed LSP package is available
      ansible.builtin.assert:
        that:
          - stylua_version.rc == 0
          - stylua_version.stdout is search('stylua')
        fail_msg: "Expected stylua to be installed via cargo"
        success_msg: "Cargo LSP package is installed"
      when: lsp_cargo | length > 0

    - name: Check go-installed LSP package
      ansible.builtin.command:
        cmd: "{{ ansible_facts.user_dir }}/go/bin/shfmt --version"
      register: shfmt_version
      changed_when: false
      environment:
        PATH: "/usr/local/go/bin:{{ ansible_facts.env.PATH }}"
      when: lsp_go | length > 0

    - name: Assert go-installed LSP package is available
      ansible.builtin.assert:
        that:
          - shfmt_version.rc == 0
        fail_msg: "Expected shfmt to be installed via go"
        success_msg: "Go LSP package is installed"
      when: lsp_go | length > 0

    - name: Check pipx-installed LSP package
      ansible.builtin.command:
        cmd: "{{ ansible_facts.user_dir }}/.local/bin/sqlfmt --version"
      register: sqlfmt_version
      changed_when: false
      when: lsp_pip | length > 0

    - name: Assert pipx-installed LSP package is available
      ansible.builtin.assert:
        that:
          - sqlfmt_version.rc == 0
        fail_msg: "Expected sqlfmt to be installed via pipx"
        success_msg: "Pipx LSP package is installed"
      when: lsp_pip | length > 0

    - name: Check apt-installed LSP dependencies on Debian
      ansible.builtin.command:
        argv:
          - bash
          - -lc
          - command -v shellcheck && command -v xmllint
      register: apt_lsp_tools
      changed_when: false
      when: ansible_facts.os_family == "Debian"

    - name: Assert apt-installed LSP dependencies are available on Debian
      ansible.builtin.assert:
        that:
          - apt_lsp_tools.rc == 0
          - "'shellcheck' in apt_lsp_tools.stdout"
          - "'xmllint' in apt_lsp_tools.stdout"
        fail_msg: "Expected shellcheck and xmllint to be installed on Debian"
        success_msg: "Debian LSP apt dependencies are installed"
      when: ansible_facts.os_family == "Debian"
