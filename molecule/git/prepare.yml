---
- name: Prepare
  hosts: all
  tasks:
    - name: Create fake Windows Git Credential Manager path for WSL test
      ansible.builtin.file:
        path: /mnt/c/Program Files/Git/ucrt64/bin
        state: directory
        mode: "0755"

    - name: Create fake git-credential-manager.exe
      ansible.builtin.copy:
        dest: /mnt/c/Program Files/Git/ucrt64/bin/git-credential-manager.exe
        content: ""
        mode: "0755"
