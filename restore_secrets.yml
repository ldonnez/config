---
- name: Restore secrets from backup
  hosts: localhost
  connection: local
  vars:
    secrets_directory: "{{ ansible_facts.user_dir }}/.secrets"
    secrets_repository: "https://github.com/ldonnez/secrets.git"
  pre_tasks:
    - name: Prepare secrets repository
      ansible.builtin.import_role:
        name: secrets
        tasks_from: repository.yml
  tasks:
    - name: Restore SSH keys and config
      ansible.builtin.import_role:
        name: ssh_backup
        tasks_from: restore.yml
      vars:
        ssh_backup_keys:
          - name: id_rsa
            private_key_path: "{{ ansible_facts.user_dir }}/.ssh/id_rsa"
            public_key_path: "{{ ansible_facts.user_dir }}/.ssh/id_rsa.pub"

    - name: Restore NeoMutt configuration
      ansible.builtin.import_role:
        name: neomutt_backup
        tasks_from: restore.yml

    - name: Restore GPG keys
      ansible.builtin.import_role:
        name: gnupg_backup
        tasks_from: restore.yml
      vars:
        gnupg_backup_gpg_key_ids:
          - lenny.donnez@gmail.com

    - name: Restore Zsh history
      ansible.builtin.import_role:
        name: zsh_history_backup
        tasks_from: restore.yml

    - name: Restore Atuin history
      ansible.builtin.import_role:
        name: atuin_backup
        tasks_from: restore.yml
