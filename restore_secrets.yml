---
- name: Restore secrets from backup
  hosts: localhost
  connection: local

  vars:
    secrets_directory: "{{ ansible_facts.user_dir }}/.secrets"
    secrets_repository: "https://github.com/ldonnez/secrets.git"

  tasks:
    - name: Update secrets repository
      ansible.builtin.git:
        repo: "{{ secrets_repository }}"
        dest: "{{ secrets_directory }}"
        version: main
        update: true

    - name: Restore ssh keys
      ansible.builtin.import_role:
        name: ssh_backup
        tasks_from: restore.yml

    - name: Restore .mutt-alias
      ansible.builtin.import_role:
        name: neomutt_backup
        tasks_from: restore.yml

    - name: Restore gpg keys
      ansible.builtin.import_role:
        name: gnupg_backup
        tasks_from: restore.yml

    - name: Restore zsh history
      ansible.builtin.import_role:
        name: zsh_history_backup
        tasks_from: restore.yml

    - name: Restore atuin history.db
      ansible.builtin.import_role:
        name: atuin_backup
        tasks_from: restore.yml
