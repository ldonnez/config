---
- name: Restore secrets from backup
  hosts: localhost
  connection: local

  vars:
    secrets_directory: "{{ ansible_facts.user_dir }}/.secrets"
    secrets_repository: "https://github.com/ldonnez/secrets.git"
    git_sync: true

  pre_tasks:
    - name: Prepare secrets repository
      ansible.builtin.import_role:
        name: secrets
        tasks_from: repository.yml
      when: git_sync | bool
      tags: always

  tasks:
    - name: Restore SSH keys and config
      ansible.builtin.import_role:
        name: ssh_backup
        tasks_from: restore.yml
      vars:
        ssh_backup_keys:
          - name: id_rsa
            private_key_path: "{{ ansible_facts.user_dir }}/.ssh/id_rsa"
            public_key_path: "{{ ansible_facts.user_dir }}/.ssh/id_rsa.pub"
      tags:
        - ssh

    - name: Restore .mutt-alias
      ansible.builtin.import_role:
        name: secret_file_backup
        tasks_from: restore.yml
      vars:
        secret_file_backup_items:
          - name: .mutt-alias
            src: "{{ ansible_facts.user_dir }}/.mutt-alias"
            dir: "{{ secrets_directory }}/mutt-alias"
            method: vault
            mode: "0700"
      tags:
        - mutt-alias

    - name: Restore .zsh_history
      ansible.builtin.import_role:
        name: secret_file_backup
        tasks_from: restore.yml
      vars:
        secret_file_backup_items:
          - name: .zsh_history
            src: "{{ ansible_facts.user_dir }}/.zsh_history"
            dir: "{{ secrets_directory }}/zsh_history/{{ ansible_facts.hostname }}"
            method: gpg
            mode: "0700"
      tags:
        - zsh_history

    - name: Restore GPG keys
      ansible.builtin.import_role:
        name: gnupg_backup
        tasks_from: restore.yml
      vars:
        gnupg_backup_gpg_key_ids:
          - lenny.donnez@gmail.com
      tags:
        - gpg

    - name: Restore atuin history
      ansible.builtin.import_role:
        name: atuin_backup
        tasks_from: restore.yml
      tags:
        - atuin
