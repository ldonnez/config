---
- name: Restore secrets from backup
  hosts: localhost
  connection: local
  vars:
    secrets_directory: "{{ ansible_facts.user_dir }}/.secrets"
    secrets_repository: "https://github.com/ldonnez/secrets.git"
  pre_tasks:
    - name: Prepare secrets repository
      ansible.builtin.import_role:
        name: secrets
        tasks_from: repository.yml
  roles:
    - role: ssh_backup
      tasks_from: restore.yml
      vars:
        ssh_backup_keys:
          - name: id_rsa
            private_key_path: "{{ ansible_facts.user_dir }}/.ssh/id_rsa"
            public_key_path: "{{ ansible_facts.user_dir }}/.ssh/id_rsa.pub"
    - role: neomutt_backup
      tasks_from: restore.yml
    - role: gnupg_backup
      tasks_from: restore.yml
    - role: zsh_history_backup
      tasks_from: restore.yml
    - role: atuin_backup
      tasks_from: restore.yml
