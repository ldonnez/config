---
- name: Restore secrets from backup
  hosts: localhost
  connection: local

  vars_files:
    - roles/secrets/defaults/main.yml

  tasks:
    - name: Prepare secrets repository
      ansible.builtin.import_tasks: roles/secrets/tasks/repository.yml

    - name: Restore ssh keys
      ansible.builtin.import_role:
        name: ssh_backup
        tasks_from: restore.yml

    - name: Restore .mutt-alias
      ansible.builtin.import_role:
        name: neomutt_backup
        tasks_from: restore.yml

    - name: Restore gpg keys
      ansible.builtin.import_role:
        name: gnupg_backup
        tasks_from: restore.yml

    - name: Restore zsh history
      ansible.builtin.import_role:
        name: zsh_history_backup
        tasks_from: restore.yml

    - name: Restore atuin history.db
      ansible.builtin.import_role:
        name: atuin_backup
        tasks_from: restore.yml
