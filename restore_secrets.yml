---
- name: Restore secrets from backup
  hosts: localhost
  connection: local
  pre_tasks:
    - name: Prepare secrets repository
      ansible.builtin.import_role:
        name: secrets
        tasks_from: repository.yml
  roles:
    - role: ssh_backup
      tasks_from: restore.yml
    - role: neomutt_backup
      tasks_from: restore.yml
    - role: gnupg_backup
      tasks_from: restore.yml
    - role: zsh_history_backup
      tasks_from: restore.yml
    - role: atuin_backup
      tasks_from: restore.yml
