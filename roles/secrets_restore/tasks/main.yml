---
- name: Secrets_restore | Prepare repository
  ansible.builtin.import_role:
    name: secrets
    tasks_from: repository.yml

- name: Secrets_restore | Run configured restores
  ansible.builtin.include_role:
    name: "{{ item }}"
    tasks_from: restore.yml
  loop: "{{ secrets_restore_roles }}"
  loop_control:
    label: "{{ item }}"
