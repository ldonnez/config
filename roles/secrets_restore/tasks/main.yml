---
- name: Secrets_restore | Prepare repository
  ansible.builtin.import_role:
    name: secrets
    tasks_from: repository.yml

- name: Secrets_restore | Restore SSH keys and config
  ansible.builtin.import_role:
    name: ssh_backup
    tasks_from: restore.yml

- name: Secrets_restore | Restore NeoMutt aliases
  ansible.builtin.import_role:
    name: neomutt_backup
    tasks_from: restore.yml

- name: Secrets_restore | Restore GPG keys
  ansible.builtin.import_role:
    name: gnupg_backup
    tasks_from: restore.yml

- name: Secrets_restore | Restore Zsh history
  ansible.builtin.import_role:
    name: zsh_history_backup
    tasks_from: restore.yml

- name: Secrets_restore | Restore Atuin history
  ansible.builtin.import_role:
    name: atuin_backup
    tasks_from: restore.yml
