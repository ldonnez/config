---
- name: Verify
  hosts: all
  vars_files:
    - ../../../../roles/dotfiles/defaults/main.yml
  tasks:
    - name: Check ag binary
      ansible.builtin.command:
        cmd: ag --version
      register: ag_version
      changed_when: false

    - name: Assert ag is installed
      ansible.builtin.assert:
        that:
          - ag_version.rc == 0
        fail_msg: "ag is not installed"
        success_msg: "ag is installed"

    - name: Check agignore symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.agignore"
        follow: false
      register: ag_ignore

    - name: Assert ag is configured
      ansible.builtin.assert:
        that:
          - ag_ignore.stat.exists
          - ag_ignore.stat.islnk
          - ag_ignore.stat.lnk_source == dotfiles_directory_path ~ '/.agignore'
        fail_msg: "ag is not configured correctly"
        success_msg: "ag is configured correctly"
