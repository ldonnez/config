---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: debian13
    image: molecule:debian13
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_SCENARIO_DIRECTORY}/../../../../roles

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
