---
- name: Install curl with apt
  become: true
  when: ansible_facts.os_family == "Debian"
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install

- name: Install atuin noninteractive with curl
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://setup.atuin.sh | sh -s -- --non-interactive --yes

  args:
    creates: "{{ ansible_facts.user_dir }}/.atuin/bin/atuin"
    executable: /bin/bash
  tags:
    - install

- name: Check zsh history
  ansible.builtin.stat:
    path: "{{ atuin_zsh_history_path }}"
  register: atuin_zsh_history
  tags:
    - install

- name: Import existing zsh history
  when: atuin_zsh_history.stat.exists
  ansible.builtin.command: atuin import zsh
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.atuin/bin:{{ ansible_facts.env.PATH }}"
  changed_when: false
  tags:
    - install

- name: Ensure zsh completions directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/share/zsh/site-functions"
    state: directory
    mode: "0755"
  tags:
    - install

- name: Install zsh completions
  ansible.builtin.command:
    argv:
      - atuin
      - gen-completions
      - --shell
      - zsh
      - --out-dir
      - "{{ ansible_facts.user_dir }}/.local/share/zsh/site-functions"
  args:
    creates: "{{ ansible_facts.user_dir }}/.local/share/zsh/site-functions/_atuin"
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.atuin/bin:{{ ansible_facts.env.PATH }}"
  tags:
    - install

- name: Upgrade atuin
  ansible.builtin.command: atuin update
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.atuin/bin:{{ ansible_facts.env.PATH }}"
    ATUIN_GITHUB_TOKEN: "{{ lookup('env', 'ATUIN_GITHUB_TOKEN') | default(lookup('env', 'GITHUB_TOKEN'), true) | default(lookup('pipe', 'gh auth token 2>/dev/null || true'), true) }}"
  register: atuin_update
  changed_when: "'Updated atuin' in (atuin_update.stdout + atuin_update.stderr)"
  tags:
    - update
    - never
