---
- name: Install curl with apt
  become: true
  when: ansible_facts.os_family == "Debian"
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install

- name: Install atuin noninteractive with curl
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://setup.atuin.sh | sh -s -- --non-interactive --yes

  args:
    creates: "{{ ansible_facts.user_dir }}/.atuin/bin/atuin"
    executable: /bin/bash
  tags:
    - install

- name: Check zsh history
  ansible.builtin.stat:
    path: "{{ atuin_zsh_history_path }}"
  register: atuin_zsh_history
  tags:
    - install

- name: Import existing zsh history
  when: atuin_zsh_history.stat.exists
  ansible.builtin.command: atuin import zsh
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.atuin/bin:{{ ansible_facts.env.PATH }}"
  tags:
    - install

- name: Check system zsh completions directory
  ansible.builtin.stat:
    path: /usr/local/share/zsh/site-functions
  register: atuin_zsh_site_functions
  tags:
    - install

- name: Set zsh completions directory
  ansible.builtin.set_fact:
    atuin_zsh_completion_dir: >-
      {{
        '/usr/local/share/zsh/site-functions'
        if atuin_zsh_site_functions.stat.writeable | default(false)
        else ansible_facts.user_dir + '/.local/share/zsh/site-functions'
      }}
  tags:
    - install

- name: Ensure zsh completions directory exists
  ansible.builtin.file:
    path: "{{ atuin_zsh_completion_dir }}"
    state: directory
    mode: "0755"
  tags:
    - install

- name: Install zsh completions
  ansible.builtin.shell: |
    atuin gen-completions --shell zsh --out-dir "{{ atuin_zsh_completion_dir }}"
  args:
    creates: "{{ atuin_zsh_completion_dir }}/_atuin"
    executable: /bin/zsh
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.atuin/bin:{{ ansible_facts.env.PATH }}"
  tags:
    - install

- name: Upgrade atuin
  ansible.builtin.command: atuin update
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.atuin/bin:{{ ansible_facts.env.PATH }}"
  tags:
    - update
