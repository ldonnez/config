---
- name: Install tmux with apt
  ansible.builtin.apt:
    name: tmux
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - install

- name: Install xsel with apt # Dependency for copy pasting
  ansible.builtin.apt:
    name: xsel
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - install

- name: Install tmux with homebrew
  community.general.homebrew:
    name: tmux
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - install
