---
- name: Gpg_file_backup | Check backup source
  ansible.builtin.stat:
    path: "{{ gpg_file_backup_source }}"
    checksum_algorithm: sha256
  register: gpg_file_backup_source_file

- name: Gpg_file_backup | Check existing backup
  ansible.builtin.stat:
    path: "{{ gpg_file_backup_destination }}"
  register: gpg_file_backup_destination_file

- name: Gpg_file_backup | Checksum existing backup plaintext for comparison
  # GPG encryption is non-deterministic, so compare the decrypted bytes rather
  # than the encrypted file. Decrypting to stdout and hashing keeps binary
  # sources (such as the Atuin SQLite database) safe and writes no plaintext to
  # disk. shasum is available on both macOS and Linux.
  when:
    - gpg_file_backup_source_file.stat.exists
    - gpg_file_backup_destination_file.stat.exists
    - not ansible_check_mode
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      gpg --batch --quiet --decrypt {{ gpg_file_backup_destination | quote }} | shasum -a 256 | cut -d ' ' -f 1
    executable: /bin/bash
  register: gpg_file_backup_existing_checksum
  changed_when: false

- name: Gpg_file_backup | Encrypt backup with GPG
  # Skip re-encryption when the existing backup already decrypts to the same
  # bytes as the source. GPG is used directly to preserve the existing
  # default-recipient behavior.
  when: >-
    gpg_file_backup_source_file.stat.exists and
    not ansible_check_mode and
    (not gpg_file_backup_destination_file.stat.exists or
    (gpg_file_backup_existing_checksum.stdout is defined and
    gpg_file_backup_existing_checksum.stdout | trim != gpg_file_backup_source_file.stat.checksum))
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --encrypt
      - --default-recipient-self
      - --output
      - "{{ gpg_file_backup_destination }}"
      - "{{ gpg_file_backup_source }}"
