---
- name: Prepare
  hosts: all
  become: true
  vars:
    vault_backup_test_dir: /tmp/vault_backup_test
    vault_backup_vault_password: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/.vault-pass') | trim }}"
  tasks:
    - name: Install ansible-core for vault operations
      ansible.builtin.apt:
        name: ansible-core
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure test directory exists
      ansible.builtin.file:
        path: "{{ vault_backup_test_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0777"

    - name: Write test files
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.content }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ vault_backup_test_dir }}/.vault-pass", content: "molecule-secret\n", mode: "0644" }
        - { path: "{{ vault_backup_test_dir }}/encrypt-source.txt", content: "vault-backup-encrypt", mode: "0644" }
        - { path: "{{ vault_backup_test_dir }}/encrypt-update-source.txt", content: "vault-backup-update-1", mode: "0644" }

    - name: Create encrypted decrypt fixture on the target
      ansible.builtin.copy:
        dest: "{{ vault_backup_test_dir }}/decrypt-source.vault"
        content: "{{ 'vault-backup-decrypt' | ansible.builtin.vault(secret=vault_backup_vault_password, vault_id='default') }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        decrypt: false
