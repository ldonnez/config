---
- name: Vault_backup | Check backup source
  ansible.builtin.stat:
    path: "{{ vault_backup_source }}"
  register: vault_backup_source_file

- name: Vault_backup | Check existing backup
  ansible.builtin.stat:
    path: "{{ vault_backup_destination }}"
  register: vault_backup_destination_file

- name: Vault_backup | Read backup source
  when: vault_backup_source_file.stat.exists
  ansible.builtin.slurp:
    src: "{{ vault_backup_source }}"
  register: vault_backup_source_content

- name: Vault_backup | Decrypt existing backup for comparison
  # stdin avoids writing the decrypted Vault password to a temporary file.
  when:
    - vault_backup_destination_file.stat.exists
    - not ansible_check_mode
  ansible.builtin.command:
    argv:
      - ansible-vault
      - view
      - --vault-password-file
      - /dev/stdin
      - "{{ vault_backup_destination }}"
    stdin: "{{ lookup('ansible.builtin.unvault', vault_backup_password_file) | string | trim }}"
    stdin_add_newline: true
  register: vault_backup_existing_content
  changed_when: false
  no_log: true

- name: Vault_backup | Encrypt backup with Ansible Vault
  # Re-encrypt when the source differs from the existing backup instead of
  # relying only on the destination's existence, so changed sources are backed
  # up. Command output strips trailing newlines, so normalize the source before
  # comparing checksums.
  when: >-
    vault_backup_source_file.stat.exists and
    not ansible_check_mode and
    (not vault_backup_destination_file.stat.exists or
    (vault_backup_existing_content.stdout is defined and
    (vault_backup_existing_content.stdout | hash('sha256')) !=
    ((vault_backup_source_content.content | b64decode).rstrip('\n') | hash('sha256'))))
  ansible.builtin.command:
    argv:
      - ansible-vault
      - encrypt
      - --vault-password-file
      - /dev/stdin
      - --output
      - "{{ vault_backup_destination }}"
      - "{{ vault_backup_source }}"
    stdin: "{{ lookup('ansible.builtin.unvault', vault_backup_password_file) | string | trim }}"
    stdin_add_newline: true
  no_log: true
