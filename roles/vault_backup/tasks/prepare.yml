---
- name: Create temporary file for vault passphrase
  ansible.builtin.tempfile:
    state: file
    suffix: .txt
  register: vault_backup_password_tmp
  no_log: true

- name: Decrypt vault passphrase
  ansible.builtin.copy:
    src: "{{ vault_backup_password_file }}"
    dest: "{{ vault_backup_password_tmp.path }}"
    mode: "0600"
    decrypt: true
  no_log: true
