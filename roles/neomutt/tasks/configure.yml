---
- name: Symlink .mbsyncrc
  ansible.builtin.file:
    src: "{{ dotfiles_directory_path }}/.mbsyncrc"
    dest: "{{ ansible_facts.user_dir }}/.mbsyncrc"
    state: link
  tags:
    - install

- name: Symlink .muttrc
  ansible.builtin.file:
    src: "{{ dotfiles_directory_path }}/.muttrc"
    dest: "{{ ansible_facts.user_dir }}/.muttrc"
    state: link
  tags:
    - install

- name: Symlink .mutt
  ansible.builtin.file:
    src: "{{ dotfiles_directory_path }}/.mutt"
    dest: "{{ ansible_facts.user_dir }}/.mutt"
    state: link
  tags:
    - install

- name: Restore .mutt-alias
  ansible.builtin.import_role:
    name: secret_file_backup
    tasks_from: restore.yml
  vars:
    secret_file_backup_items:
      - name: .mutt-alias
        src: "{{ ansible_facts.user_dir }}/.mutt-alias"
        dir: "{{ secrets_directory }}/mutt-alias"
        method: vault
        mode: "0700"
  tags:
    - install

- name: Symlink .msmtprc
  ansible.builtin.file:
    src: "{{ dotfiles_directory_path }}/.msmtprc"
    dest: "{{ ansible_facts.user_dir }}/.msmtprc"
    state: link
  tags:
    - install

- name: Symlink .urlview
  ansible.builtin.file:
    src: "{{ dotfiles_directory_path }}/.urlview"
    dest: "{{ ansible_facts.user_dir }}/.urlview"
    state: link
  tags:
    - install

- name: Symlink.mailcap
  ansible.builtin.file:
    src: "{{ dotfiles_directory_path }}/.mailcap"
    dest: "{{ ansible_facts.user_dir }}/.mailcap"
    state: link
  tags:
    - install

- name: Symlink .notmuch-config
  ansible.builtin.file:
    src: "{{ dotfiles_directory_path }}/.notmuch-config"
    dest: "{{ ansible_facts.user_dir }}/.notmuch-config"
    state: link
  tags:
    - install

- name: Ensure mail directories
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.mail/{{ item }}"
    recurse: true
    state: directory
  loop:
    - gmail
  tags:
    - install

- name: Check mail every 2 minutes with cron
  when: neomutt_configure_with_cron
  tags:
    - install

  block:
    - name: Getting flock binary location
      ansible.builtin.command: which flock
      register: neomutt_flock_binary
      changed_when: false

    - name: Check mail every minute with cron
      ansible.builtin.cron:
        name: "check mail"
        minute: "*/2"
        job: "{{ neomutt_flock_binary.stdout }} -w 0 /var/lock/mbsync.lock bash -c $HOME/.mutt/sync-mail.sh"

- name: Check mail every 2 minutes with systemd
  when: ansible_facts.os_family == "Debian" and not neomutt_configure_with_cron
  tags:
    - install

  block:
    - name: Ensure ~/.config/systemd/user
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.config/systemd/user"
        state: directory
        recurse: true

    - name: Copy mbsync.service file
      ansible.builtin.copy:
        src: mbsync.service
        dest: "{{ ansible_facts.user_dir }}/.config/systemd/user"
        mode: "0700"

    - name: Copy mbsync.timer file
      ansible.builtin.copy:
        src: mbsync.timer
        dest: "{{ ansible_facts.user_dir }}/.config/systemd/user"
        mode: "0700"

    - name: Reload systemd
      become: true
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start systemd timer
      ansible.builtin.systemd:
        name: mbsync.timer
        state: started
        scope: user
        enabled: true

- name: Check mail every 2 minutes with launchctl
  when: ansible_facts.os_family == "Darwin" and not neomutt_configure_with_cron
  tags:
    - install
    - temp
  block:
    - name: Check if homebrew isync service is loaded
      ansible.builtin.command: launchctl list homebrew.mxcl.isync
      register: neomutt_homebrew_isync_loaded
      changed_when: false
      failed_when: false

    - name: Unload homebrew isync service
      community.general.launchd:
        name: homebrew.mxcl.isync
        plist: homebrew.mxcl.isync.plist
        state: unloaded
      when: neomutt_homebrew_isync_loaded.rc == 0

    - name: Delete existing homebrew.mxcl.isync.plist
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/Library/LaunchAgents/homebrew.mxcl.isync.plist"
        state: absent

    - name: Check if local.isync is loaded
      ansible.builtin.command: launchctl list local.isync
      register: neomutt_local_isync_loaded
      changed_when: false
      failed_when: false

    - name: Install local.isync.plist
      ansible.builtin.copy:
        src: local.isync.plist
        dest: "{{ ansible_facts.user_dir }}/Library/LaunchAgents/local.isync.plist"
        mode: "0600"
      register: neomutt_local_isync_copy

    - name: Reload local.isync launch agent
      community.general.launchd:
        name: local.isync
        state: reloaded
      when:
        - neomutt_local_isync_copy.changed or neomutt_local_isync_loaded.rc != 0
