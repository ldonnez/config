---
- name: Install fd with apt
  ansible.builtin.apt:
    name: fd-find
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - install

- name: Install fd with homebrew
  community.general.homebrew:
    name: fd
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - install
