- name: Secure GPG key backup
  tags:
    - backup
  block:
    - name: Ensure backup dir
      ansible.builtin.file:
        path: "{{ gnupg_backup_dir }}"
        state: directory
        recurse: true

    - name: Create temporary backup file
      ansible.builtin.tempfile:
        state: file
        suffix: .asc
      register: gnupg_backup_tmp

    - name: Create temporary file for vault passphrase
      ansible.builtin.tempfile:
        state: file
        suffix: .txt
      register: gnupg_backup_pass_tmp
      no_log: true

    - name: Write vault passphrase to temp file
      ansible.builtin.copy:
        src: "{{ gnupg_backup_vault_password_file_path }}"
        dest: "{{ gnupg_backup_pass_tmp.path }}"
        mode: "0600"
        decrypt: true
      no_log: true

    - name: Export GPG secret and public keypair (non interactive)
      ansible.builtin.command:
        argv:
          - gpg
          - --yes
          - --armor
          - --batch
          - --pinentry-mode
          - loopback
          - --export-secret-keys
          - --passphrase-file
          - "{{ gnupg_backup_pass_tmp.path }}"
          - --export-options
          - backup
          - --output
          - "{{ gnupg_backup_tmp.path }}"
          - "{{ gnupg_backup_gpg_key_id }}"
      changed_when: false

    - name: Encrypt backup file with ansible-vault
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt
          - --vault-password-file
          - "{{ gnupg_backup_pass_tmp.path }}"
          - --output
          - "{{ gnupg_backup_path }}"
          - "{{ gnupg_backup_tmp.path }}"

  always:
    - name: Remove temporary passphrase file
      ansible.builtin.file:
        path: "{{ gnupg_backup_pass_tmp.path }}"
        state: absent
      when: gnupg_backup_pass_tmp.path is defined

    - name: Remove temporary file
      ansible.builtin.file:
        path: "{{ gnupg_backup_tmp.path }}"
        state: absent
      when: gnupg_backup_tmp.path is defined

- name: Commit and push backup
  ansible.builtin.command:
    cmd: "{{ item }}"
    chdir: "{{ gnupg_backup_secrets_directory }}"
  loop:
    - git add -- "{{ gnupg_backup_path | relpath(gnupg_backup_path) }}"
    - git commit -m "Backup gpg keys"
    - git push
