---
- name: Check whether GPG secret key is already present
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --list-secret-keys
      - --with-colons
      - "{{ gnupg_backup_key_id }}"
  register: gnupg_backup_existing_key
  changed_when: false
  failed_when: false

- name: Check GPG key backup {{ gnupg_backup_key_id }}
  ansible.builtin.stat:
    path: "{{ gnupg_backup_dir }}/{{ gnupg_backup_key_id }}.asc.vault"
  register: gnupg_backup_key_backup

- name: Warn when GPG key backup is missing {{ gnupg_backup_key_id }}
  when: not gnupg_backup_key_backup.stat.exists
  ansible.builtin.debug:
    msg: "Skipping GPG key restore for {{ gnupg_backup_key_id }}: {{ gnupg_backup_dir }}/{{ gnupg_backup_key_id }}.asc.vault not found"

- name: Secure GPG key restore for {{ gnupg_backup_key_id }}
  when:
    - "'sec:' not in gnupg_backup_existing_key.stdout"
    - gnupg_backup_key_backup.stat.exists
  block:
    - name: Create temporary file for decrypted GPG import
      ansible.builtin.tempfile:
        state: file
        suffix: .asc
      register: gnupg_backup_tmp

    - name: Decrypt GPG key backup to temporary file
      ansible.builtin.include_role:
        name: vault_backup
        tasks_from: decrypt.yml
      vars:
        vault_backup_source: "{{ gnupg_backup_dir }}/{{ gnupg_backup_key_id }}.asc.vault"
        vault_backup_destination: "{{ gnupg_backup_tmp.path }}"
        vault_backup_mode: "0600"

    - name: Import GPG keypair into keyring (non-interactive)
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --yes
          - --import
          - "{{ gnupg_backup_tmp.path }}"
      register: gnupg_backup_import
      changed_when: "'secret keys imported: 1' in (gnupg_backup_import.stderr + gnupg_backup_import.stdout)"

  always:
    - name: Remove temporary decrypted GPG restore file
      ansible.builtin.file:
        path: "{{ gnupg_backup_tmp.path }}"
        state: absent
      when: gnupg_backup_tmp.path is defined
