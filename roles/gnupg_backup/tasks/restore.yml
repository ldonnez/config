- name: Secure GPG key import
  tags:
    - restore
  block:
    - name: Create temporary file for decrypted GPG import
      ansible.builtin.tempfile:
        state: file
        suffix: .asc
      register: gnupg_backup_tmp

    - name: Decrypt GPG backup to temporary file
      ansible.builtin.copy:
        src: "{{ gnupg_backup_path }}"
        dest: "{{ gnupg_backup_tmp.path }}"
        mode: "0600"
        decrypt: true

    - name: Import GPG keypair into keyring (non-interactive)
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --yes
          - --import
          - "{{ gnupg_backup_tmp.path }}"
      changed_when: true

  always:
    - name: Remove temporary decrypted GPG restore file
      ansible.builtin.file:
        path: "{{ gnupg_backup_tmp.path }}"
        state: absent
      when: gnupg_backup_tmp.path is defined
