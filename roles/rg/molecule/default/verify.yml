---
- name: Verify
  hosts: all
  vars_files:
    - ../../../../roles/dotfiles/defaults/main.yml
  tasks:
    - name: Check rg binary
      ansible.builtin.command:
        cmd: rg --version
      register: rg_version
      changed_when: false

    - name: Assert rg is installed
      ansible.builtin.assert:
        that:
          - rg_version.rc == 0
          - rg_version.stdout is search('ripgrep')
        fail_msg: "ripgrep is not installed"
        success_msg: "ripgrep is installed"

    - name: Check rgignore symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.rgignore"
        follow: false
      register: rg_ignore

    - name: Assert rg is configured
      ansible.builtin.assert:
        that:
          - rg_ignore.stat.exists
          - rg_ignore.stat.islnk
          - rg_ignore.stat.lnk_source == dotfiles_directory_path ~ '/.agignore'
        fail_msg: "ripgrep is not configured correctly"
        success_msg: "ripgrep is configured correctly"
