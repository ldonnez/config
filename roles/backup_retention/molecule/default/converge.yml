---
- name: Converge
  hosts: all
  tasks:
    - name: Prune backups keeping newest 2
      ansible.builtin.include_role:
        name: backup_retention
      vars:
        backup_retention_dir: /tmp/backup_retention_keep2
        backup_retention_pattern: "*.bak"
        backup_retention_keep: 2

    - name: Run retention with keep=0 (should not prune)
      ansible.builtin.include_role:
        name: backup_retention
      vars:
        backup_retention_dir: /tmp/backup_retention_keep0
        backup_retention_pattern: "*.bak"
        backup_retention_keep: 0
