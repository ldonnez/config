---
- name: Converge
  hosts: all
  vars:
    secret_file_backup_test_dir: /tmp/secret_file_backup_test
    secret_file_backup_vault_password_file: "{{ playbook_dir }}/files/password_file.vault"
    secret_file_backup_keep: 10
    secret_file_backup_items:
      - name: gpg-secret
        src: "{{ secret_file_backup_test_dir }}/src/gpg-secret.txt"
        dir: "{{ secret_file_backup_test_dir }}/backup/gpg"
        method: gpg
      - name: vault-secret
        src: "{{ secret_file_backup_test_dir }}/src/vault-secret.txt"
        dir: "{{ secret_file_backup_test_dir }}/backup/vault"
        method: vault
        mode: "0640"
  tasks:
    - name: Run secret_file_backup role (backup)
      ansible.builtin.include_role:
        name: secret_file_backup
        tasks_from: backup.yml

    - name: Ensure controller vault backup directory exists
      ansible.builtin.file:
        path: "{{ secret_file_backup_test_dir }}/backup/vault"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Fetch vault backup to controller for decrypt
      ansible.builtin.fetch:
        src: "{{ secret_file_backup_test_dir }}/backup/vault/latest"
        dest: "{{ secret_file_backup_test_dir }}/backup/vault/"
        flat: true

    - name: Remove source files to simulate restore target
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ secret_file_backup_test_dir }}/src/gpg-secret.txt"
        - "{{ secret_file_backup_test_dir }}/src/vault-secret.txt"

    - name: Run secret_file_backup role (restore)
      ansible.builtin.include_role:
        name: secret_file_backup
        tasks_from: restore.yml
