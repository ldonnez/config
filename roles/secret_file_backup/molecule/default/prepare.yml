---
- name: Prepare
  hosts: all
  become: true
  vars:
    secret_file_backup_test_dir: /tmp/secret_file_backup_test
  tasks:
    - name: Install test dependencies
      ansible.builtin.apt:
        name:
          - gnupg
          - ansible-core
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure test directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0777"
      loop:
        - "{{ secret_file_backup_test_dir }}"
        - "{{ secret_file_backup_test_dir }}/src"
        - "{{ secret_file_backup_test_dir }}/backup/gpg"
        - "{{ secret_file_backup_test_dir }}/backup/vault"

    - name: Create GPG key batch file
      become: false
      ansible.builtin.copy:
        dest: "{{ secret_file_backup_test_dir }}/key.batch"
        mode: "0600"
        content: |
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Name-Real: Molecule Test
          Name-Email: molecule@example.com
          Expire-Date: 0
          %commit

    - name: Check for existing secret key
      become: false
      ansible.builtin.command:
        cmd: gpg --list-secret-keys molecule@example.com
      register: secret_file_backup_key_check
      changed_when: false
      failed_when: false

    - name: Generate test GPG key
      become: false
      ansible.builtin.command:
        cmd: "gpg --batch --generate-key {{ secret_file_backup_test_dir }}/key.batch"
      when: secret_file_backup_key_check.rc != 0
      changed_when: true

    - name: Create source secret files
      become: false
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.content }}"
        mode: "0600"
      loop:
        - { path: "{{ secret_file_backup_test_dir }}/src/gpg-secret.txt", content: "secret-gpg" }
        - { path: "{{ secret_file_backup_test_dir }}/src/vault-secret.txt", content: "secret-vault" }
