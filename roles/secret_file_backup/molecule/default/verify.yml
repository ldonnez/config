---
- name: Verify
  hosts: all
  vars:
    secret_file_backup_test_dir: /tmp/secret_file_backup_test
  tasks:
    - name: Find GPG backups
      ansible.builtin.find:
        paths: "{{ secret_file_backup_test_dir }}/backup/gpg"
        patterns: "*-gpg-secret.gpg"
        file_type: file
      register: secret_file_backup_gpg_files

    - name: Find Vault backups
      ansible.builtin.find:
        paths: "{{ secret_file_backup_test_dir }}/backup/vault"
        patterns: "*-vault-secret.vault"
        file_type: file
      register: secret_file_backup_vault_files

    - name: Stat latest symlinks
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      register: secret_file_backup_latest
      loop:
        - "{{ secret_file_backup_test_dir }}/backup/gpg/latest"
        - "{{ secret_file_backup_test_dir }}/backup/vault/latest"

    - name: Assert backup artifacts exist
      ansible.builtin.assert:
        that:
          - secret_file_backup_gpg_files.matched == 1
          - secret_file_backup_vault_files.matched == 1
          - secret_file_backup_latest.results[0].stat.exists
          - secret_file_backup_latest.results[0].stat.islnk
          - secret_file_backup_latest.results[1].stat.exists
          - secret_file_backup_latest.results[1].stat.islnk

    - name: Check GPG backup is encrypted
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --list-packets
          - "{{ secret_file_backup_gpg_files.files[0].path }}"
      register: secret_file_backup_gpg_packets
      changed_when: false
      failed_when: false

    - name: Assert GPG backup is encrypted
      ansible.builtin.assert:
        that:
          - secret_file_backup_gpg_packets.rc == 0
          - (secret_file_backup_gpg_packets.stdout ~ secret_file_backup_gpg_packets.stderr) is search('encrypted|public key encrypted|symmetrically encrypted')

    - name: Read Vault backup header
      ansible.builtin.slurp:
        src: "{{ secret_file_backup_vault_files.files[0].path }}"
      register: secret_file_backup_vault_header

    - name: Assert Vault backup is Ansible Vault encrypted
      ansible.builtin.assert:
        that:
          - (secret_file_backup_vault_header.content | b64decode).startswith('$ANSIBLE_VAULT;')

    - name: Stat restored source files
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: secret_file_backup_restored
      loop:
        - { path: "{{ secret_file_backup_test_dir }}/src/gpg-secret.txt", mode: "0600" }
        - { path: "{{ secret_file_backup_test_dir }}/src/vault-secret.txt", mode: "0640" }
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Assert restored files exist with expected modes
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.mode == item.item.mode
      loop: "{{ secret_file_backup_restored.results }}"
      loop_control:
        label: "{{ item.item.path | basename }}"

    - name: Read restored source files
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: secret_file_backup_contents
      loop:
        - { path: "{{ secret_file_backup_test_dir }}/src/gpg-secret.txt", content: "secret-gpg" }
        - { path: "{{ secret_file_backup_test_dir }}/src/vault-secret.txt", content: "secret-vault" }
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Assert restored content matches
      ansible.builtin.assert:
        that:
          - (item.content | b64decode) == item.item.content
      loop: "{{ secret_file_backup_contents.results }}"
      loop_control:
        label: "{{ item.item.path | basename }}"
