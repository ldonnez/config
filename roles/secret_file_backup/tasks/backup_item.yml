---
- name: Secret_file_backup | Ensure backup directory for {{ secret_file_backup_item.name }}
  ansible.builtin.file:
    path: "{{ secret_file_backup_item.dir }}"
    state: directory
    mode: "0700"

- name: Secret_file_backup | Set backup destination for {{ secret_file_backup_item.name }}
  ansible.builtin.set_fact:
    secret_file_backup_destination: >-
      {{ secret_file_backup_item.dir }}/{{ ansible_facts.date_time.iso8601_basic_short }}-{{ secret_file_backup_item.name | regex_replace('^\.', '') }}.{{ 'gpg' if secret_file_backup_item.method == 'gpg' else 'vault' }}

- name: Secret_file_backup | Encrypt with GPG {{ secret_file_backup_item.name }}
  ansible.builtin.include_role:
    name: gpg_file_backup
    tasks_from: encrypt.yml
  vars:
    gpg_file_backup_source: "{{ secret_file_backup_item.src }}"
    gpg_file_backup_destination: "{{ secret_file_backup_destination }}"
  when: secret_file_backup_item.method == "gpg"

- name: Secret_file_backup | Encrypt with Ansible Vault {{ secret_file_backup_item.name }}
  ansible.builtin.include_role:
    name: vault_backup
    tasks_from: encrypt.yml
  vars:
    vault_backup_password_file: "{{ secret_file_backup_vault_password_file }}"
    vault_backup_source: "{{ secret_file_backup_item.src }}"
    vault_backup_destination: "{{ secret_file_backup_destination }}"
  when: secret_file_backup_item.method == "vault"

- name: Secret_file_backup | Update latest backup symlink for {{ secret_file_backup_item.name }}
  ansible.builtin.file:
    src: "{{ secret_file_backup_destination | basename }}"
    dest: "{{ secret_file_backup_item.dir }}/latest"
    state: link
    force: true
