---
- name: "Ensure ~/.npm"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.npm"
    state: directory
    mode: "0755"
  tags:
    - install

- name: Read npm bin
  ansible.builtin.command: npm config get prefix
  register: npm_prefix
  changed_when: false
  tags:
    - install
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"

- name: Set npm bin
  when: npm_prefix.stdout != (ansible_facts.user_dir ~ '/.npm')
  ansible.builtin.command:
    argv:
      - npm
      - config
      - set
      - prefix
      - "{{ ansible_facts.user_dir }}/.npm"
  tags:
    - install
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"

- name: Install build dependencies for npm native modules
  when:
    - ansible_facts.os_family == "Debian"
    - npm_packages | length > 0
  become: true
  ansible.builtin.apt:
    name:
      - build-essential
      - python3
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install

- name: Install global npm packages
  when: npm_packages | length > 0
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  loop: "{{ npm_packages }}"
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.user_dir }}/.npm/bin:{{ ansible_facts.env.PATH }}"
  tags:
    - install

- name: Update global npm packages
  when: npm_packages | length > 0
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
  loop: "{{ npm_packages }}"
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.user_dir }}/.npm/bin:{{ ansible_facts.env.PATH }}"
  tags:
    - update
    - never
