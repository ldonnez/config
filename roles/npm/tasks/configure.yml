---
- name: "Ensure ~/.npm"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.npm"
    state: directory
    mode: "0755"
  tags:
    - install

- name: Read npm bin
  ansible.builtin.command: npm config get prefix
  register: npm_prefix
  changed_when: false
  tags:
    - install
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"

- name: Set npm bin
  when: npm_prefix.stdout != (ansible_facts.user_dir ~ '/.npm')
  ansible.builtin.command:
    argv:
      - npm
      - config
      - set
      - prefix
      - "{{ ansible_facts.user_dir }}/.npm"
  tags:
    - install
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"

- name: Get global npm root
  ansible.builtin.command: npm root -g
  register: npm_global_root
  changed_when: false
  tags:
    - update
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.user_dir }}/.npm/bin:{{ ansible_facts.env.PATH }}"

- name: Ensure global npm root exists
  ansible.builtin.file:
    path: "{{ npm_global_root.stdout }}"
    state: directory
    mode: "0755"
  tags:
    - update

- name: List global npm packages
  ansible.builtin.command:
    argv:
      - npm
      - ls
      - -g
      - --depth=0
      - --json
  register: npm_global_packages
  changed_when: false
  tags:
    - update
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.user_dir }}/.npm/bin:{{ ansible_facts.env.PATH }}"

- name: Check for outdated global npm packages
  ansible.builtin.command:
    argv:
      - npm
      - outdated
      - -g
      - --json
  register: npm_outdated
  changed_when: false
  failed_when: npm_outdated.rc not in [0, 1]
  when: ((npm_global_packages.stdout | from_json).get('dependencies', {}) | length) > 0
  tags:
    - update
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.user_dir }}/.npm/bin:{{ ansible_facts.env.PATH }}"

- name: Update global npm packages
  ansible.builtin.command:
    argv:
      - npm
      - update
      - -g
  register: npm_update
  changed_when: true
  when:
    - ((npm_global_packages.stdout | from_json).get('dependencies', {}) | length) > 0
    - (npm_outdated.stdout | default('{}', true) | from_json | length) > 0
  async: 300
  poll: 15
  tags:
    - update
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.user_dir }}/.npm/bin:{{ ansible_facts.env.PATH }}"
