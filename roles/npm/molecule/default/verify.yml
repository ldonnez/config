---
- name: Verify
  hosts: all
  vars:
    npm_prefix: "{{ ansible_facts.user_dir }}/.npm"
  tasks:
    - name: Check that the npm prefix directory and config exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ npm_prefix }}"
        - "{{ ansible_facts.user_dir }}/.npmrc"
      register: npm_paths

    - name: Read the npm version
      ansible.builtin.command:
        cmd: npm --version
      register: npm_version
      changed_when: false
      environment:
        PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"

    - name: Read the configured npm prefix
      ansible.builtin.command:
        cmd: npm config get prefix
      register: npm_configured_prefix
      changed_when: false
      environment:
        PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"

    - name: Check managed npm package binary
      ansible.builtin.stat:
        path: "{{ npm_prefix }}/bin/tsc"
      register: npm_typescript_bin

    - name: Assert the npm role configured the global prefix and packages
      ansible.builtin.assert:
        that:
          - npm_paths.results | selectattr('stat.exists') | list | length == 2
          - npm_version.stdout | length > 0
          - npm_configured_prefix.stdout == npm_prefix
          - npm_typescript_bin.stat.exists
        fail_msg: "The npm role did not configure the global prefix or managed packages"
        success_msg: "The npm role configured the global prefix and managed packages"
