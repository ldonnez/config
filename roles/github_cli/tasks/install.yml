- name: Check if gh is installed
  ansible.builtin.stat:
    path: /usr/bin/gh
  register: github_cli_bin
  tags:
    - install

- name: Install GitHub CLI with apt
  when:
    - ansible_facts.os_family == "Debian"
    - not github_cli_bin.stat.exists
  become: true
  tags:
    - install
  block:
    - name: Install python3-debian (required by deb822_repository)
      ansible.builtin.apt:
        name: python3-debian
        state: present

    - name: Get system architecture (e.g. amd64)
      ansible.builtin.command: dpkg --print-architecture
      register: github_cli_system_arch
      changed_when: false

    - name: Remove legacy github cli sources entry
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/github-cli.list
        state: absent

    - name: Add github cli to sources list
      ansible.builtin.deb822_repository:
        name: github-cli
        types: deb
        uris: https://cli.github.com/packages
        suites: stable
        components: main
        architectures: "{{ github_cli_system_arch.stdout }}"
        signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        state: present

    - name: Install GitHub CLI package
      ansible.builtin.apt:
        name: gh
        state: present
        update_cache: true

- name: Install gh with homebrew
  when: ansible_facts.os_family == "Darwin"
  community.general.homebrew:
    name: gh
    state: present
  tags:
    - install
