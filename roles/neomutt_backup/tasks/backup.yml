- name: Secure .mutt-alias backup
  tags:
    - backup
  block:
    - name: Ensure backup dir
      ansible.builtin.file:
        path: "{{ neomutt_backup_dir }}"
        state: directory
        recurse: true

    - name: Create temporary file for vault passphrase
      ansible.builtin.tempfile:
        state: file
        suffix: .txt
      register: neomutt_backup_pass_tmp
      no_log: true

    - name: Write vault passphrase to temp file
      ansible.builtin.copy:
        src: "{{ neomutt_backup_vault_password_file_path }}"
        dest: "{{ neomutt_backup_pass_tmp.path }}"
        mode: "0600"
        decrypt: true
      no_log: true

    - name: Encrypt .mutt-alias with ansible-vault
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt
          - --vault-password-file
          - "{{ neomutt_backup_pass_tmp.path }}"
          - --output
          - "{{ neomutt_backup_mutt_alias_backup_path }}"
          - "{{ neomutt_backup_mutt_alias_path }}"

  always:
    - name: Remove temporary passphrase file
      ansible.builtin.file:
        path: "{{ neomutt_backup_pass_tmp.path }}"
        state: absent
      when: neomutt_backup_pass_tmp.path is defined
