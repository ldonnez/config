- name: Secure .mutt-alias backup
  tags:
    - backup
  block:
    - name: Ensure backup dir
      ansible.builtin.file:
        path: "{{ neomutt_backup_dir }}"
        state: directory
        recurse: true

    - name: Prepare vault passphrase
      ansible.builtin.import_role:
        name: vault_backup
        tasks_from: prepare.yml
      vars:
        vault_backup_password_file: "{{ neomutt_backup_vault_password_file_path }}"

    - name: Encrypt .mutt-alias
      ansible.builtin.import_role:
        name: vault_backup
        tasks_from: encrypt.yml
      vars:
        vault_backup_source: "{{ neomutt_backup_mutt_alias_path }}"
        vault_backup_destination: "{{ neomutt_backup_mutt_alias_backup_path }}"

  always:
    - name: Clean up vault passphrase
      ansible.builtin.import_role:
        name: vault_backup
        tasks_from: cleanup.yml
