---
- name: Secrets_backup | Prepare repository
  ansible.builtin.import_role:
    name: secrets
    tasks_from: repository.yml

- name: Secrets_backup | Run configured backups
  ansible.builtin.include_role:
    name: "{{ item }}"
    tasks_from: backup.yml
  loop: "{{ secrets_backup_roles }}"
  loop_control:
    label: "{{ item }}"

- name: Secrets_backup | Commit and push artifacts
  ansible.builtin.import_role:
    name: secrets
    tasks_from: commit.yml
  when: not ansible_check_mode
