---
- name: Verify
  hosts: all
  vars:
    cargo_bin: "{{ ansible_facts.user_dir }}/.cargo/bin"
  tasks:
    - name: Check that rustup, cargo and rustc exist
      ansible.builtin.stat:
        path: "{{ cargo_bin }}/{{ item }}"
      loop:
        - rustup
        - cargo
        - rustc
      register: rust_binaries

    - name: Read the rustup version
      ansible.builtin.command:
        cmd: "{{ cargo_bin }}/rustup --version"
      register: rust_rustup_version
      changed_when: false

    - name: Read the cargo version
      ansible.builtin.command:
        cmd: "{{ cargo_bin }}/cargo --version"
      register: rust_cargo_version
      changed_when: false

    - name: Read the rustc version
      ansible.builtin.command:
        cmd: "{{ cargo_bin }}/rustc --version"
      register: rust_rustc_version
      changed_when: false

    - name: Read the active rust toolchain
      ansible.builtin.command:
        cmd: "{{ cargo_bin }}/rustup show active-toolchain"
      register: rust_toolchain
      changed_when: false

    - name: Check managed cargo package
      ansible.builtin.command:
        cmd: "{{ cargo_bin }}/stylua --version"
      register: rust_stylua_version
      changed_when: false

    - name: Assert the rust role installed a working Rust toolchain and packages
      ansible.builtin.assert:
        that:
          - rust_binaries.results | selectattr('stat.exists') | list | length == 3
          - rust_rustup_version.stdout is search('rustup')
          - rust_cargo_version.stdout is search('cargo')
          - rust_rustc_version.stdout is search('rustc')
          - rust_toolchain.stdout is search('stable')
          - rust_stylua_version.stdout is search('stylua')
        fail_msg: "The rust role did not install a working Rust toolchain or managed packages"
        success_msg: "The rust role installed a working Rust toolchain and managed packages"
