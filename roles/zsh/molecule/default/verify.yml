---
- name: Verify
  hosts: all
  vars:
    dotfiles_path: "{{ ansible_facts.user_dir }}/dotfiles"
  tasks:
    - name: Read the user shell
      ansible.builtin.command:
        cmd: "getent passwd {{ ansible_facts.user_id }}"
      register: zsh_user
      changed_when: false

    - name: Read the zsh version
      ansible.builtin.command:
        cmd: zsh --version
      register: zsh_version
      changed_when: false

    - name: Check the zshrc symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.zshrc"
      register: zsh_zshrc

    - name: Check the hushlogin file
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.hushlogin"
      register: zsh_hushlogin

    - name: Check the zsh plugins
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.zsh/plugins/{{ item }}/.git"
      loop:
        - zsh-z
        - fzf-tab
      register: zsh_plugins

    - name: Assert the zsh role installed and configured zsh
      ansible.builtin.assert:
        that:
          - "zsh_user.stdout.split(':')[-1] == '/bin/zsh'"
          - zsh_version.stdout is search('zsh')
          - zsh_zshrc.stat.islnk | default(false)
          - zsh_zshrc.stat.lnk_source | default('') == dotfiles_path ~ '/.zshrc'
          - zsh_hushlogin.stat.exists | default(false)
          - zsh_plugins.results | selectattr('stat.exists') | list | length == 2
        fail_msg: "The zsh role did not install or configure zsh"
        success_msg: "The zsh role installed and configured zsh"
