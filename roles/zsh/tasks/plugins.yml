---
- name: Install git with apt
  become: true
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"
  tags:
    - install

- name: Install/Update zsh-z plugin
  ansible.builtin.git:
    repo: https://github.com/agkozak/zsh-z
    dest: "{{ ansible_facts.user_dir }}/.zsh/plugins/zsh-z"
    version: master
    update: true
  tags:
    - install
    - update

- name: Install/Update fzf-tab plugin
  ansible.builtin.git:
    repo: https://github.com/Aloxaf/fzf-tab
    dest: "{{ ansible_facts.user_dir }}/.zsh/plugins/fzf-tab"
    version: master
    update: true
  tags:
    - install
    - update
