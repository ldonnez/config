---
- name: Verify
  hosts: all
  tasks:
    - name: Check the opencode binary
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.opencode/bin/opencode"
      register: opencode_binary

    - name: Read the opencode version
      ansible.builtin.command:
        cmd: "{{ ansible_facts.user_dir }}/.opencode/bin/opencode --version"
      register: opencode_version
      changed_when: false

    - name: Assert opencode is installed
      ansible.builtin.assert:
        that:
          - opencode_binary.stat.exists
          - opencode_binary.stat.executable
          - opencode_version.rc == 0
          - opencode_version.stdout | length > 0
        fail_msg: "opencode is not installed correctly"
        success_msg: "opencode is installed"
