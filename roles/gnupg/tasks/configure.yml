---
- name: Create .gnupg directory
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.gnupg"
    state: directory
    mode: "0700"
  tags:
    - install

- name: Symlink gpg-agent.conf
  ansible.builtin.file:
    src: "{{ dotfiles_directory_path }}/.gnupg/gpg-agent.conf"
    dest: "{{ ansible_facts.user_dir }}/.gnupg/gpg-agent.conf"
    state: link
  tags:
    - install

- name: Reload gpg-agent
  ansible.builtin.command: gpgconf --reload gpg-agent
  failed_when: false
  changed_when: false
  tags:
    - install

- name: Check if .secrets exists
  ansible.builtin.stat:
    path: "{{ ansible_facts.user_dir }}/.secrets"
  register: gnupg_secrets_directory
  tags:
    - install

- name: Restore gpg keys
  when: gnupg_secrets_directory.stat.exists
  ansible.builtin.import_role:
    name: gnupg_backup
    tasks_from: restore.yml
  tags:
    - install
