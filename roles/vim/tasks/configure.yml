---
- name: Ensure .vim
  ansible.builtin.file:
    name: "{{ ansible_facts.user_dir }}/.vim"
    state: directory
    recurse: true
  tags:
    - install

- name: Symlink .vimrc
  ansible.builtin.file:
    src: "{{ dotfiles_directory_path }}/.vimrc"
    dest: "{{ ansible_facts.user_dir }}/.vimrc"
    state: link
    force: true
  tags:
    - install

- name: Symlink .gvimrc
  ansible.builtin.file:
    src: "{{ dotfiles_directory_path }}/.gvimrc"
    dest: "{{ ansible_facts.user_dir }}/.gvimrc"
    state: link
    force: true
  tags:
    - install

- name: Symlink .vim/coc-settings.json
  ansible.builtin.file:
    src: "{{ dotfiles_directory_path }}/.vim/coc-settings.json"
    dest: "{{ ansible_facts.user_dir }}/.vim/coc-settings.json"
    state: link
    force: true
  tags:
    - install

- name: Check for vim.basic
  ansible.builtin.stat:
    path: /usr/bin/vim.basic
  register: vim_basic
  tags:
    - install
    - update

# `vim` may resolve to nvim via update-alternatives. Use `vim.basic` when
# available to ensure Vim plugins are managed with vim, not nvim.
- name: Set vim binary
  ansible.builtin.set_fact:
    vim_binary: "{{ '/usr/bin/vim.basic' if vim_basic.stat.exists else 'vim' }}"
  tags:
    - install
    - update

- name: Upgrade vim-plug & Install/Update vim plugins
  tags:
    - install
    - update
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/share/mise/shims:{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"
  block:
    - name: Upgrade vim-plug
      ansible.builtin.command:
        argv:
          - "{{ vim_binary }}"
          - "+PlugUpgrade"
          - "+qall"

    - name: Install/Update vim plugins
      ansible.builtin.command:
        argv:
          - "{{ vim_binary }}"
          - "+PlugUpdate"
          - "+qall"
