---
- name: Install libpq with homebrew
  community.general.homebrew:
    name: libpq
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - install

- name: Install libpq with apt
  when: ansible_facts.os_family == "Debian"
  become: true
  tags:
    - install
  block:
    - name: Install dependencies
      ansible.builtin.apt:
        name: ["postgresql-common", "python3-debian"]
        state: present

    - name: Get system architecture (e.g. amd64)
      ansible.builtin.command: dpkg --print-architecture
      register: libpq_system_arch
      changed_when: false

    - name: Add postgresql to sources list
      ansible.builtin.deb822_repository:
        name: pgdg
        types: deb
        uris: https://apt.postgresql.org/pub/repos/apt
        suites: "{{ ansible_facts.distribution_release }}-pgdg"
        components: main
        architectures: "{{ libpq_system_arch.stdout }}"
        signed_by: /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
        state: present

    - name: Install postgresql-client with apt
      ansible.builtin.apt:
        name: postgresql-client
        state: present
        update_cache: true
