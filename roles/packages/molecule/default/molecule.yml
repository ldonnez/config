---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: debian13
    image: molecule:debian13
    pre_build_image: true
    privileged: true
    override_command: false
    tmpfs:
      - /run
      - /run/lock
  - name: ubuntu2204
    image: molecule:ubuntu2204
    pre_build_image: true
    privileged: true
    override_command: false
    tmpfs:
      - /run
      - /run/lock
  - name: ubuntu2604
    image: molecule:ubuntu2604
    pre_build_image: true
    privileged: true
    override_command: false
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_SCENARIO_DIRECTORY}/../../../../roles
  inventory:
    host_vars:
      debian13:
        ansible_user: molecule
      ubuntu2204:
        ansible_user: molecule
      ubuntu2604:
        ansible_user: molecule

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
