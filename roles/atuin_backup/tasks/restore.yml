- name: Include install
  ansible.builtin.import_tasks: install.yml

- name: Restore atuin history.db
  tags:
    - restore
  block:
    - name: Create temporary restore database
      ansible.builtin.tempfile:
        state: file
        suffix: .db
      register: atuin_backup_restore_tmp

    - name: Decrypt backup
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --yes
          - --decrypt
          - --output
          - "{{ atuin_backup_restore_tmp.path }}"
          - "{{ atuin_backup_latest_backup_symlink }}"

    - name: Restore SQLite backup
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ atuin_backup_db_path }}"
          - ".restore {{ atuin_backup_restore_tmp.path }}"

  always:
    - name: Remove temporary restore database
      ansible.builtin.file:
        path: "{{ atuin_backup_restore_tmp.path }}"
        state: absent
      when: atuin_backup_restore_tmp.path is defined
