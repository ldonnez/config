- name: Include install
  ansible.builtin.import_tasks: install.yml

- name: Restore atuin history.db
  tags:
    - restore
  block:
    - name: Create temporary restore database
      ansible.builtin.tempfile:
        state: file
        suffix: .db
      register: atuin_backup_restore_tmp

    - name: Decrypt backup
      ansible.builtin.import_role:
        name: gpg_file_backup
        tasks_from: decrypt.yml
      vars:
        gpg_file_backup_source: "{{ atuin_backup_latest_backup_symlink }}"
        gpg_file_backup_destination: "{{ atuin_backup_restore_tmp.path }}"

    - name: Restore SQLite backup
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ atuin_backup_db_path }}"
          - ".restore {{ atuin_backup_restore_tmp.path }}"

  always:
    - name: Remove temporary restore database
      ansible.builtin.file:
        path: "{{ atuin_backup_restore_tmp.path }}"
        state: absent
      when: atuin_backup_restore_tmp.path is defined
