- name: Install sqlite # For restore of history.db
  become: true
  ansible.builtin.apt:
    name: sqlite3
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"
  tags:
    - restore

- name: Install sqlite # For restore of history.db
  community.general.homebrew:
    name: sqlite3
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - restore
