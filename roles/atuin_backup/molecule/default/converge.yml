---
- name: Converge
  hosts: all
  vars:
    atuin_backup_test_dir: /tmp/atuin_backup_test
    atuin_backup_db_path: "{{ atuin_backup_test_dir }}/.atuin/data/history.db"
    atuin_backup_dir: "{{ atuin_backup_test_dir }}/backup"
    atuin_backup_path: "{{ atuin_backup_dir }}/history.db.gpg"
    atuin_backup_latest_backup_symlink: "{{ atuin_backup_dir }}/latest"
    atuin_backup_keep: 10
  tasks:
    - name: Run atuin_backup role (backup)
      ansible.builtin.include_role:
        name: atuin_backup
        tasks_from: backup.yml

    - name: Check restore test marker
      ansible.builtin.stat:
        path: "{{ atuin_backup_test_dir }}/restore_done"
      register: atuin_backup_restore_marker

    - name: Test restore path
      when: not atuin_backup_restore_marker.stat.exists
      block:
        - name: Remove existing history database before restore
          ansible.builtin.file:
            path: "{{ atuin_backup_db_path }}"
            state: absent

        - name: Create empty target database for sqlite3 .restore
          ansible.builtin.command:
            argv:
              - sqlite3
              - "{{ atuin_backup_db_path }}"
              - "VACUUM;"
          changed_when: true

        - name: Run atuin_backup role (restore)
          ansible.builtin.include_role:
            name: atuin_backup
            tasks_from: restore.yml

        - name: Mark restore test done
          ansible.builtin.file:
            path: "{{ atuin_backup_test_dir }}/restore_done"
            state: touch
            mode: "0644"
