---
- name: Verify
  hosts: all
  vars_files:
    - ../../../../roles/dotfiles/defaults/main.yml
    - ../../../../roles/git/defaults/main.yml
  vars:
    gitconfig_path: "{{ git_config_dir }}/.gitconfig"
    gitignore_global_path: "{{ git_config_dir }}/.gitignore_global"
  tasks:
    - name: Check that Git is installed
      ansible.builtin.command:
        cmd: git --version
      register: git_version
      changed_when: false
      # noqa: command-instead-of-module

    - name: Assert Git reports a version
      ansible.builtin.assert:
        that:
          - git_version.rc == 0
          - git_version.stdout is search('git version')
        fail_msg: "Git is not installed or does not report a version"
        success_msg: "Git is installed"

    - name: Check that the dotfiles repository exists
      ansible.builtin.stat:
        path: "{{ dotfiles_directory_path }}"
      register: git_dotfiles_directory

    - name: Check that the dotfiles directory is a Git repository
      ansible.builtin.stat:
        path: "{{ dotfiles_directory_path }}/.git"
      register: git_dotfiles_git_directory

    - name: Read the dotfiles remote URL
      ansible.builtin.command:
        cmd: git -C {{ dotfiles_directory_path }} remote get-url origin
      register: git_dotfiles_remote_url
      changed_when: false
      # noqa: command-instead-of-module

    - name: Assert the dotfiles dependency is present
      ansible.builtin.assert:
        that:
          - git_dotfiles_directory.stat.exists
          - git_dotfiles_directory.stat.isdir
          - git_dotfiles_git_directory.stat.exists
          - git_dotfiles_git_directory.stat.isdir
          - git_dotfiles_remote_url.stdout == dotfiles_repo
        fail_msg: "Expected dotfiles repository at {{ dotfiles_directory_path }} with origin {{ dotfiles_repo }}"
        success_msg: "Dotfiles repository is present"

    - name: Check the copied Git config file
      ansible.builtin.stat:
        path: "{{ gitconfig_path }}"
      register: git_gitconfig_file

    - name: Read the configured Git user name
      ansible.builtin.command:
        argv:
          - git
          - config
          - --file
          - "{{ gitconfig_path }}"
          - --get
          - user.name
      register: git_user_name
      changed_when: false

    - name: Assert the Git config is installed
      ansible.builtin.assert:
        that:
          - git_gitconfig_file.stat.exists
          - git_gitconfig_file.stat.isreg
          - not (git_gitconfig_file.stat.islnk | default(false))
          - git_gitconfig_file.stat.mode == '0755'
          - git_user_name.stdout == 'Lenny'
        fail_msg: "Expected {{ gitconfig_path }} to be a copied gitconfig with user.name 'Lenny'"
        success_msg: "Git config is installed correctly"

    - name: Check the global Git ignore symlink
      ansible.builtin.stat:
        path: "{{ gitignore_global_path }}"
        follow: false
      register: git_ignore_global

    - name: Check the dotfiles global Git ignore source
      ansible.builtin.stat:
        path: "{{ git_dotfiles_path }}/.gitignore_global"
      register: git_ignore_global_source

    - name: Assert the global Git ignore is symlinked to dotfiles
      ansible.builtin.assert:
        that:
          - git_ignore_global.stat.exists
          - git_ignore_global.stat.islnk
          - git_ignore_global.stat.lnk_source == git_dotfiles_path ~ '/.gitignore_global'
          - git_ignore_global_source.stat.exists
        fail_msg: "Expected {{ gitignore_global_path }} to symlink to {{ git_dotfiles_path }}/.gitignore_global"
        success_msg: "Global Git ignore is symlinked correctly"

    - name: Check the fake WSL Git Credential Manager executable
      ansible.builtin.stat:
        path: /mnt/c/Program Files/Git/ucrt64/bin/git-credential-manager.exe
      register: git_credential_manager_exe

    - name: Read the configured Git credential helper
      ansible.builtin.command:
        argv:
          - git
          - config
          - --global
          - --get
          - credential.helper
      register: git_credential_helper
      changed_when: false

    - name: Assert the WSL Git Credential Manager is configured when present
      ansible.builtin.assert:
        that:
          - git_credential_manager_exe.stat.exists
          - git_credential_helper.stdout == '/mnt/c/Program\ Files/Git/ucrt64/bin/git-credential-manager.exe'
        fail_msg: "Expected global credential.helper to be configured for the WSL Git Credential Manager"
        success_msg: "WSL Git Credential Manager is configured correctly"
