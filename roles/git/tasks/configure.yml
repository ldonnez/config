---
- name: Copy gitconfig to ~/.gitconfig
  ansible.builtin.copy:
    src: "{{ git_dotfiles_path }}/.gitconfig"
    dest: "{{ git_config_dir }}/.gitconfig"
    mode: "0755"
    force: false
  tags:
    - install

- name: Check if git-crential-manager.exe exists
  ansible.builtin.stat:
    path: "/mnt/c/Program\ Files/Git/ucrt64/bin/git-credential-manager.exe"
  register: git_credential_manager_exe
  tags:
    - install

- name: Configure Git Credential Manager for WSL # Ensures MFA and SSO works in Github Enterprise environments.
  community.general.git_config:
    name: credential.helper
    scope: global
    value: /mnt/c/Program\ Files/Git/ucrt64/bin/git-credential-manager.exe
  when: git_credential_manager_exe.stat.exists
  tags:
    - install

- name: Symlink .gitignore_global
  ansible.builtin.file:
    src: "{{ git_dotfiles_path }}/.gitignore_global"
    dest: "{{ git_config_dir }}/.gitignore_global"
    state: link
  tags:
    - install
