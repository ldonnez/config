---
- name: Verify
  hosts: all
  vars_files:
    - ../../../../roles/memo/defaults/main.yml
    - ../../../../roles/dotfiles/defaults/main.yml
  tasks:
    - name: Check memo binary
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.local/bin/memo"
      register: memo_binary

    - name: Assert memo is installed
      ansible.builtin.assert:
        that:
          - memo_binary.stat.exists
          - memo_binary.stat.executable
        fail_msg: "memo is not installed"
        success_msg: "memo is installed"

    - name: Check memo config symlink
      ansible.builtin.stat:
        path: "{{ memo_config_dir }}/config"
        follow: false
      register: memo_config

    - name: Assert memo is configured
      ansible.builtin.assert:
        that:
          - memo_config.stat.exists
          - memo_config.stat.islnk
          - memo_config.stat.lnk_source == memo_dotfiles_path ~ '/config'
        fail_msg: "memo is not configured correctly"
        success_msg: "memo is configured correctly"
