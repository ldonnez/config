---
- name: Install gnupg with apt
  ansible.builtin.apt:
    name: gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - install

- name: Install curl with apt
  become: true
  when: ansible_facts.os_family == "Debian"
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install

- name: Install gnupg with homebrew
  community.general.homebrew:
    name: gnupg
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - install

- name: Install memo
  ansible.builtin.shell: |
    set -o pipefail
    curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/ldonnez/memo/main/install.sh | bash
  args:
    creates: "{{ ansible_facts.user_dir }}/.local/bin/memo"
    executable: /bin/bash
  tags:
    - install

- name: Upgrade memo
  ansible.builtin.command: memo upgrade --force
  register: memo_upgrade_result
  changed_when: "'Already up to date' not in memo_upgrade_result.stdout"
  tags:
    - update
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"
