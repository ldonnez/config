---
- name: Check for pre-existing staged changes
  ansible.builtin.command:
    argv:
      - git
      - diff
      - --cached
      - --quiet
  args:
    chdir: "{{ secrets_directory }}"
  changed_when: false

- name: Stage backup artifacts
  ansible.builtin.command:
    argv:
      - git
      - add
      - --
      - "{{ item }}"
  args:
    chdir: "{{ secrets_directory }}"
  loop: "{{ secrets_backup_paths }}"
  loop_control:
    label: "{{ item }}"

- name: Check whether backup artifacts changed
  ansible.builtin.command:
    argv:
      - git
      - diff
      - --cached
      - --quiet
  args:
    chdir: "{{ secrets_directory }}"
  register: secrets_backup_changes
  changed_when: false
  failed_when: secrets_backup_changes.rc not in [0, 1]

- name: Commit backup artifacts
  ansible.builtin.command:
    argv:
      - git
      - commit
      - -m
      - Backup secrets
  args:
    chdir: "{{ secrets_directory }}"
  when: secrets_backup_changes.rc == 1

- name: Push backup commit
  ansible.builtin.command:
    argv:
      - git
      - push
  args:
    chdir: "{{ secrets_directory }}"
  when: secrets_backup_changes.rc == 1
