---
# Read-only Git commands inspect the index; the command module is used because
# Git's quiet diff exit status distinguishes clean (0) from changed (1).
- name: Secrets | Check for pre-existing staged changes
  ansible.builtin.command:
    argv:
      - git
      - diff
      - --cached
      - --quiet
  args:
    chdir: "{{ secrets_directory }}"
  changed_when: false
  failed_when: false
  register: secrets_existing_staged_changes

- name: Secrets | Fail if Git could not inspect the index
  ansible.builtin.fail:
    msg: "Unable to inspect staged changes in the secrets repository."
  when: secrets_existing_staged_changes.rc not in [0, 1]

- name: Secrets | Refuse to include unrelated staged changes
  ansible.builtin.fail:
    msg: >-
      The secrets repository already contains staged changes. Commit or unstage
      them before running the backup.
  when: secrets_existing_staged_changes.rc == 1

- name: Secrets | Stage backup artifacts
  ansible.builtin.command:
    argv:
      - git
      - add
      - --
      - "{{ item }}"
  args:
    chdir: "{{ secrets_directory }}"
  loop: "{{ secrets_backup_paths }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: Secrets | Check whether backup artifacts changed
  ansible.builtin.command:
    argv:
      - git
      - diff
      - --cached
      - --quiet
  args:
    chdir: "{{ secrets_directory }}"
  register: secrets_backup_changes
  changed_when: false
  failed_when: secrets_backup_changes.rc not in [0, 1]

- name: Secrets | Commit backup artifacts
  ansible.builtin.command:
    argv:
      - git
      - commit
      - -m
      - Backup secrets
  args:
    chdir: "{{ secrets_directory }}"
  when: secrets_backup_changes.rc == 1

- name: Secrets | Push backup commit
  ansible.builtin.command:
    argv:
      - git
      - push
  args:
    chdir: "{{ secrets_directory }}"
  when: secrets_backup_changes.rc == 1
