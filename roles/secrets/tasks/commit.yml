---
- name: Secrets | Stage repository changes
  ansible.builtin.command:
    argv:
      - git
      - add
      - --all
  args:
    chdir: "{{ secrets_directory }}"
  changed_when: false

- name: Secrets | Check for staged changes
  ansible.builtin.command:
    argv:
      - git
      - diff
      - --cached
      - --quiet
  args:
    chdir: "{{ secrets_directory }}"
  register: secrets_backup_changes
  changed_when: false
  failed_when: secrets_backup_changes.rc not in [0, 1]

- name: Secrets | Commit backup
  ansible.builtin.command:
    argv:
      - git
      - commit
      - -m
      - Backup secrets
  args:
    chdir: "{{ secrets_directory }}"
  when: secrets_backup_changes.rc == 1

- name: Secrets | Push backup
  ansible.builtin.command:
    argv:
      - git
      - push
  args:
    chdir: "{{ secrets_directory }}"
  when: secrets_backup_changes.rc == 1
