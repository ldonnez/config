---
- name: Secrets | Check if repository exists
  ansible.builtin.stat:
    path: "{{ secrets_directory }}"
  register: secrets_dir
  tags:
    - install

- name: Secrets | Authenticate GitHub CLI before cloning
  when: not secrets_dir.stat.exists
  tags:
    - install
  block:
    - name: secrets | Check GitHub CLI authentication
      ansible.builtin.command:
        argv:
          - gh
          - auth
          - status
      register: secrets_gh_status
      failed_when: false
      changed_when: false

    - name: secrets | Prompt for GitHub authentication
      ansible.builtin.pause:
        prompt: |
          GitHub login required

          Run the following command in another terminal:

          gh auth login

          If you are on a headless server, you can switch to another terminal session using Ctrl+Alt+F2.

          For headless environments, run:

          BROWSER=false gh auth login

          Note that the process may take a few moments to complete while you approve the login in your browser or device.

          Then press ENTER here to continue.
      when: secrets_gh_status.rc != 0

    - name: secrets | Configure GitHub CLI as Git credential helper
      ansible.builtin.command:
        argv:
          - gh
          - auth
          - setup-git
      failed_when: false
      changed_when: false

- name: Secrets | Clone or update repository
  ansible.builtin.git:
    repo: "{{ secrets_repository }}"
    dest: "{{ secrets_directory }}"
    version: main
    update: true
  tags:
    - install
