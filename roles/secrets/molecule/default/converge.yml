---
- name: Converge
  hosts: all
  vars:
    secrets_directory: "{{ ansible_facts.user_dir }}/.secrets"
    secrets_repository: /tmp/secrets-fixture
  roles:
    - role: secrets

- name: Converge with existing non-git secrets directory
  hosts: all
  vars:
    secrets_directory: "{{ ansible_facts.user_dir }}/.secrets-local"
    secrets_repository: /tmp/secrets-fixture
  tasks:
    - name: Create a non-git secrets directory
      ansible.builtin.file:
        path: "{{ secrets_directory }}"
        state: directory
        mode: "0700"

    - name: Create a marker file in the non-git secrets directory
      ansible.builtin.copy:
        dest: "{{ secrets_directory }}/marker.txt"
        content: "keep me"
        mode: "0600"

    - name: Run secrets role against existing non-git directory
      ansible.builtin.import_role:
        name: secrets
