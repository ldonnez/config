---
- name: Verify
  hosts: all
  vars:
    secrets_directory: "{{ ansible_facts.user_dir }}/.secrets"
    secrets_repository: /tmp/secrets-fixture
  tasks:
    - name: Check the secrets repository
      ansible.builtin.stat:
        path: "{{ secrets_directory }}/.git"
      register: secrets_repository_git

    - name: Read the secrets repository remote
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ secrets_directory }}"
          - remote
          - get-url
          - origin
      register: secrets_repository_remote
      changed_when: false

    - name: Check the secrets fixture file
      ansible.builtin.stat:
        path: "{{ secrets_directory }}/README.md"
      register: secrets_readme

    - name: Check the GitHub CLI binary installed by the dependency
      ansible.builtin.stat:
        path: /usr/bin/gh
      register: secrets_github_cli

    - name: Check the non-git secrets directory
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.secrets-local/.git"
      register: secrets_local_git

    - name: Check the non-git secrets marker
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.secrets-local/marker.txt"
      register: secrets_local_marker

    - name: Read the non-git secrets marker
      ansible.builtin.slurp:
        src: "{{ ansible_facts.user_dir }}/.secrets-local/marker.txt"
      register: secrets_local_marker_content

    - name: Assert the secrets repository was cloned
      ansible.builtin.assert:
        that:
          - secrets_repository_git.stat.exists
          - secrets_repository_git.stat.isdir
          - secrets_repository_remote.stdout == 'file:///tmp/secrets-fixture'
          - secrets_readme.stat.exists
          - secrets_readme.stat.isreg
          - secrets_github_cli.stat.exists
          - secrets_github_cli.stat.executable
        fail_msg: "The secrets repository was not cloned correctly"
        success_msg: "The secrets repository was cloned correctly"

    - name: Assert an existing non-git secrets directory is left alone
      ansible.builtin.assert:
        that:
          - not secrets_local_git.stat.exists
          - secrets_local_marker.stat.exists
          - (secrets_local_marker_content.content | b64decode) == 'keep me'
        fail_msg: "An existing non-git secrets directory was modified"
        success_msg: "An existing non-git secrets directory was left alone"
