---
- name: Prepare
  hosts: all
  tasks:
    - name: Install git
      become: true
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create a non-interactive GitHub CLI for authentication checks
      become: true
      ansible.builtin.copy:
        dest: /usr/local/bin/gh
        mode: "0755"
        content: |
          #!/bin/sh
          if [ "$1" = "auth" ]; then
            exit 0
          fi
          if [ -x /usr/bin/gh ]; then
            exec /usr/bin/gh "$@"
          fi
          exit 0

    - name: Ensure the secrets fixture directory exists
      ansible.builtin.file:
        path: /tmp/secrets-fixture
        state: directory
        mode: "0755"

    - name: Initialize the secrets fixture repository
      ansible.builtin.command:
        argv:
          - git
          - init
          - --initial-branch=main
          - /tmp/secrets-fixture
      args:
        creates: /tmp/secrets-fixture/.git

    - name: Create a file in the secrets fixture repository
      ansible.builtin.copy:
        dest: /tmp/secrets-fixture/README.md
        content: |
          # Molecule secrets fixture
        mode: "0644"

    - name: Check the secrets fixture repository HEAD
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /tmp/secrets-fixture
          - rev-parse
          - --verify
          - HEAD
      register: secrets_fixture_head
      changed_when: false
      failed_when: false

    - name: Stage the secrets fixture files
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /tmp/secrets-fixture
          - add
          - .
      changed_when: true

    - name: Commit the secrets fixture repository
      when: secrets_fixture_head.rc != 0
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /tmp/secrets-fixture
          - -c
          - user.name=Molecule
          - -c
          - user.email=molecule@example.com
          - commit
          - -m
          - Initial commit
      changed_when: true
