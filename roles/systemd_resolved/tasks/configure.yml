---
- name: Ensure systemd-resolved is enabled and started
  become: true
  ansible.builtin.systemd_service:
    name: systemd-resolved
    enabled: true
    masked: false
    state: started
  tags:
    - install

- name: Ensure systemd-resolved configuration directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  tags:
    - install

- name: Configure DNS-over-TLS
  become: true
  ansible.builtin.copy:
    src: dns-over-tls.conf
    dest: /etc/systemd/resolved.conf.d/dns-over-tls.conf
    mode: "0644"
  notify: Restart systemd-resolved
  tags:
    - install

- name: Ensure /etc/resolv.conf points to systemd-resolved
  become: true
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  tags:
    - install
