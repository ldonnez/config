---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # Docker bind-mounts /etc/resolv.conf into containers for DNS. The role
    # replaces it with a symlink, but renaming over a bind mount fails with
    # EBUSY. Unmount it here and recreate it as a regular file so DNS keeps
    # working for converge.
    - name: Read the container DNS configuration
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: systemd_resolved_resolv_conf

    - name: Unmount the container-managed /etc/resolv.conf
      ansible.posix.mount:
        path: /etc/resolv.conf
        state: unmounted

    - name: Recreate /etc/resolv.conf to preserve DNS
      ansible.builtin.copy:
        content: "{{ systemd_resolved_resolv_conf.content | b64decode }}"
        dest: /etc/resolv.conf
        mode: "0644"
