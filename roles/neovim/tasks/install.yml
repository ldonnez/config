---
- name: Check if nvim is installed
  ansible.builtin.stat:
    path: /usr/bin/nvim
  register: neovim_bin
  tags:
    - install
    - update

- name: Get installed nvim version
  ansible.builtin.command: nvim --version
  register: neovim_current_version
  changed_when: false
  when:
    - ansible_facts.os_family == "Debian"
    - neovim_bin.stat.exists
  tags:
    - install
    - update

- name: Get latest neovim stable release
  ansible.builtin.uri:
    url: "https://api.github.com/repos/neovim/neovim/releases/latest"
    return_content: true
  register: neovim_latest_release
  when: ansible_facts.os_family == "Debian"
  tags:
    - install
    - update

- name: Build neovim when missing or outdated
  become: true
  when:
    - ansible_facts.os_family == "Debian"
    - not neovim_bin.stat.exists or neovim_latest_release.json.tag_name != neovim_current_version.stdout_lines[0].split()[1]
  tags:
    - install
    - update
  block:
    - name: Install build dependencies
      ansible.builtin.apt:
        name:
          [
            "ninja-build",
            "gettext",
            "cmake",
            "unzip",
            "curl",
            "build-essential",
          ]
        state: present

    - name: Install inotify-tools
      ansible.builtin.apt:
        name: inotify-tools # Better file watching backend: check :LspInfo and ensure File watch backend is inotify
        state: present

    - name: Git clone neovim repository
      ansible.builtin.git:
        repo: https://github.com/neovim/neovim
        depth: 1
        version: stable
        dest: /tmp/neovim

    - name: Configure neovim build
      ansible.builtin.command: make CMAKE_BUILD_TYPE=RelWithDebInfo
      args:
        chdir: /tmp/neovim

    - name: Create nvim-linux-x86_64.deb package
      ansible.builtin.command: cpack -G DEB
      args:
        chdir: /tmp/neovim/build

    - name: Install nvim-linux-x86_64.deb package
      ansible.builtin.command: dpkg -i --force-overwrite nvim-linux-x86_64.deb
      args:
        chdir: /tmp/neovim/build

  always:
    - name: Remove /tmp/neovim
      ansible.builtin.file:
        path: /tmp/neovim
        state: absent

- name: Install neovim & neovim-qt with homebrew
  community.general.homebrew:
    name: ["neovim", "neovim-qt"]
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - install
