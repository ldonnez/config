---
- name: Install curl with apt
  become: true
  when: ansible_facts.os_family == "Debian"
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install

- name: Install mise
  ansible.builtin.shell: |
    set -o pipefail
    curl https://mise.run | sh
  args:
    creates: "{{ ansible_facts.user_dir }}/.local/bin/mise"
    executable: /bin/bash
  tags:
    - install

- name: Install usage
  ansible.builtin.command: mise use -g usage
  register: mise_usage
  changed_when: "'already installed' not in (mise_usage.stdout ~ mise_usage.stderr)"
  tags:
    - install
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"

- name: Check system zsh completions directory
  ansible.builtin.stat:
    path: /usr/local/share/zsh/site-functions
  register: mise_zsh_site_functions
  tags:
    - install

- name: Set zsh completions directory
  ansible.builtin.set_fact:
    mise_zsh_completion_dir: >-
      {{
        '/usr/local/share/zsh/site-functions'
        if mise_zsh_site_functions.stat.writeable | default(false)
        else ansible_facts.user_dir + '/.local/share/zsh/site-functions'
      }}
  tags:
    - install

- name: Ensure zsh completions directory exists
  ansible.builtin.file:
    path: "{{ mise_zsh_completion_dir }}"
    state: directory
    mode: "0755"
  tags:
    - install

- name: Install zsh completions
  ansible.builtin.shell: |
    mise completion zsh > "{{ mise_zsh_completion_dir }}/_mise"
  args:
    creates: "{{ mise_zsh_completion_dir }}/_mise"
    executable: /bin/zsh
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"
  tags:
    - install

- name: Update mise
  ansible.builtin.command: mise self-update --yes
  register: mise_self_update
  changed_when: "'already up to date' not in (mise_self_update.stdout ~ mise_self_update.stderr)"
  tags:
    - update
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"
