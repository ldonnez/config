---
- name: Install curl with apt
  become: true
  when: ansible_facts.os_family == "Debian"
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install

- name: Install mise
  ansible.builtin.shell: |
    set -o pipefail
    curl https://mise.run | sh
  args:
    creates: "{{ ansible_facts.user_dir }}/.local/bin/mise"
    executable: /bin/bash
  tags:
    - install

- name: Install usage
  ansible.builtin.command: mise use -g usage
  register: mise_usage
  changed_when: "'already installed' not in (mise_usage.stdout ~ mise_usage.stderr)"
  tags:
    - install
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"

- name: Ensure zsh completions directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/share/zsh/site-functions"
    state: directory
    mode: "0755"
  tags:
    - install

- name: Install zsh completions
  ansible.builtin.command: mise completion zsh --install
  args:
    creates: "{{ ansible_facts.user_dir }}/.local/share/zsh/site-functions/_mise"
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"
  tags:
    - install

- name: Update mise
  ansible.builtin.command: mise self-update --yes
  register: mise_self_update
  changed_when: "'already up to date' not in (mise_self_update.stdout ~ mise_self_update.stderr)"
  tags:
    - update
    - never
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"
