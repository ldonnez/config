---
- name: Install dependencies
  become: true
  ansible.builtin.apt:
    name:
      - libegl1
      - libfontconfig1
      - libfreetype6
      - libgl1
      - libglx0
      - libxcb-cursor0
      - libxkbcommon-x11-0
      - libxkbcommon0
      - libopengl0
      - wget
      - xz-utils
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"
  tags:
    - install

- name: Install/Update Calibre
  become: true
  when: ansible_facts.os_family == "Debian"
  ansible.builtin.shell: |
    set -o pipefail
    sudo -v && wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sudo sh /dev/stdin
  args:
    creates: "/usr/bin/calibre"
    executable: /bin/bash
  tags:
    - install

- name: Force update Calibre
  become: true
  when: ansible_facts.os_family == "Debian"
  ansible.builtin.shell: |
    set -o pipefail
    sudo -v && wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sudo sh /dev/stdin
  args:
    executable: /bin/bash
  tags:
    - update
