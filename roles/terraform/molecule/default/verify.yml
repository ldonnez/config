---
- name: Verify
  hosts: all
  tasks:
    - name: Check terraform binary
      ansible.builtin.command:
        cmd: terraform version
      register: terraform_version
      changed_when: false

    - name: Assert terraform is installed
      ansible.builtin.assert:
        that:
          - terraform_version.rc == 0
          - terraform_version.stdout is search('Terraform')
        fail_msg: "terraform is not installed"
        success_msg: "terraform is installed"
