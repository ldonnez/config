---
- name: Tap homebrew repositories
  when: ansible_facts.os_family == "Darwin"
  community.general.homebrew_tap:
    name: "hashicorp/tap"
    state: present
  tags:
    - install

- name: Install terraform with homebrew
  when: ansible_facts.os_family == "Darwin"
  community.general.homebrew:
    name: "hashicorp/tap/terraform"
    state: present
  tags:
    - install

- name: Check if terraform is installed
  when: ansible_facts.os_family == "Debian"
  ansible.builtin.stat:
    path: /usr/bin/terraform
  register: terraform_bin
  tags:
    - install

- name: Install terraform with apt
  when:
    - ansible_facts.os_family == "Debian"
    - not terraform_bin.stat.exists
  become: true
  tags:
    - install
  block:
    - name: Install python3-debian (required by deb822_repository)
      ansible.builtin.apt:
        name: python3-debian
        state: present

    - name: Remove legacy hashicorp keyring
      ansible.builtin.file:
        path: /etc/apt/keyrings/hashicorp.gpg
        state: absent

    - name: Get system architecture
      ansible.builtin.command: dpkg --print-architecture
      register: terraform_system_arch
      changed_when: false

    - name: Add hashicorp to sources list
      ansible.builtin.deb822_repository:
        name: hashicorp
        types: deb
        uris: https://apt.releases.hashicorp.com
        suites: "{{ ansible_facts.lsb.codename }}"
        components: main
        architectures: "{{ terraform_system_arch.stdout }}"
        signed_by: https://apt.releases.hashicorp.com/gpg
        state: present

    - name: Install terraform with apt
      ansible.builtin.apt:
        name: terraform
        state: present
        update_cache: true

    - name: Install terraform-ls with apt
      ansible.builtin.apt:
        name: terraform-ls
        state: present
