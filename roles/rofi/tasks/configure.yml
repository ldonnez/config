---
- name: "Ensure {{ rofi_config_dir | dirname }}"
  ansible.builtin.file:
    name: "{{ rofi_config_dir }} | dirname"
    state: directory
    recurse: true
  tags:
    - install

- name: Symlink ~/.config/rofi
  ansible.builtin.file:
    src: "{{ rofi_dotfiles_path }}"
    dest: "{{ rofi_config_dir }}"
    state: link
  tags:
    - install
