- name: Restore .zsh_history
  tags:
    - restore
  block:
    - name: Decrypt and restore backup
      ansible.builtin.import_role:
        name: gpg_file_backup
        tasks_from: decrypt.yml
      vars:
        gpg_file_backup_source: "{{ zsh_history_backup_latest_backup_symlink }}"
        gpg_file_backup_destination: "{{ zsh_history_backup_zsh_history_path }}"
