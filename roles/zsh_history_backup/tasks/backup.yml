- name: Backup .zsh_history
  tags:
    - backup
  block:
    - name: Ensure backup dir
      ansible.builtin.file:
        path: "{{ zsh_history_backup_dir }}"
        state: directory
        recurse: true

    - name: Encrypt backup
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --yes
          - --encrypt
          - --default-recipient-self
          - --output
          - "{{ zsh_history_backup_path }}"
          - "{{ zsh_history_backup_zsh_history_path }}"

    - name: Update latest backup symlink
      ansible.builtin.file:
        src: "{{ zsh_history_backup_path }}"
        dest: "{{ zsh_history_backup_latest_backup_symlink }}"
        state: link
        force: true
