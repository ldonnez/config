- name: Backup .zsh_history
  tags:
    - backup
  block:
    - name: Ensure backup dir
      ansible.builtin.file:
        path: "{{ zsh_history_backup_dir }}"
        state: directory
        recurse: true

    - name: Encrypt backup
      ansible.builtin.import_role:
        name: gpg_file_backup
        tasks_from: encrypt.yml
      vars:
        gpg_file_backup_source: "{{ zsh_history_backup_zsh_history_path }}"
        gpg_file_backup_destination: "{{ zsh_history_backup_path }}"

    - name: Update latest backup symlink
      ansible.builtin.file:
        src: "{{ zsh_history_backup_path }}"
        dest: "{{ zsh_history_backup_latest_backup_symlink }}"
        state: link
        force: true
