---
- name: Prepare
  hosts: all
  become: true
  vars:
    ssh_backup_test_dir: /tmp/ssh_backup_test
  tasks:
    - name: Install test dependencies
      ansible.builtin.apt:
        name:
          - ansible-core
          - openssh-client
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure test directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"
      loop:
        - "{{ ssh_backup_test_dir }}"
        - "{{ ssh_backup_test_dir }}/src/.ssh"
        - "{{ ssh_backup_test_dir }}/backup/.ssh"
        - "{{ ssh_backup_test_dir }}/restore/.ssh"

    - name: Generate a valid SSH key pair fixture
      become: false
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - rsa
          - -b
          - "3072"
          - -N
          - ""
          - -C
          - molecule@example.com
          - -f
          - "{{ ssh_backup_test_dir }}/src/.ssh/id_rsa"
      args:
        creates: "{{ ssh_backup_test_dir }}/src/.ssh/id_rsa"

    - name: Preserve the expected SSH public key
      become: false
      ansible.builtin.copy:
        src: "{{ ssh_backup_test_dir }}/src/.ssh/id_rsa.pub"
        dest: "{{ ssh_backup_test_dir }}/expected_id_rsa.pub"
        remote_src: true
        mode: "0600"

    - name: Create SSH config fixture
      become: false
      ansible.builtin.copy:
        dest: "{{ ssh_backup_test_dir }}/src/.ssh/config"
        content: |
          Host molecule-test
            HostName example.com
            User molecule
        mode: "0600"
