---
- name: Verify
  hosts: all
  vars:
    ssh_backup_test_dir: /tmp/ssh_backup_test
  tasks:
    - name: Check missing SSH restore targets remain absent
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ ssh_backup_test_dir }}/restore/.ssh/id_ed25519"
        - "{{ ssh_backup_test_dir }}/restore/.ssh/id_ed25519.pub"
        - "{{ ssh_backup_test_dir }}/restore/.ssh/missing-config"
      register: ssh_backup_missing_targets

    - name: Assert missing SSH backups are skipped
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "Unexpectedly restored missing SSH backup target {{ item.item }}"
      loop: "{{ ssh_backup_missing_targets.results }}"
      loop_control:
        label: "{{ item.item | basename }}"

    - name: Stat backup artifacts
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: ssh_backup_artifacts
      loop:
        - { path: "{{ ssh_backup_test_dir }}/backup/.ssh/id_rsa.vault", mode: "0600" }
        - { path: "{{ ssh_backup_test_dir }}/backup/.ssh/id_rsa.pub", mode: "0600" }
        - { path: "{{ ssh_backup_test_dir }}/backup/.ssh/config.vault", mode: "0600" }
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Assert backup artifacts exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
      loop: "{{ ssh_backup_artifacts.results }}"
      loop_control:
        label: "{{ item.item.path | basename }}"

    - name: Read vaulted backup headers
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: ssh_backup_vault_headers
      loop:
        - "{{ ssh_backup_test_dir }}/backup/.ssh/id_rsa.vault"
        - "{{ ssh_backup_test_dir }}/backup/.ssh/config.vault"

    - name: Assert backups are Ansible Vault encrypted
      ansible.builtin.assert:
        that:
          - (item.content | b64decode).startswith('$ANSIBLE_VAULT;')
      loop: "{{ ssh_backup_vault_headers.results }}"
      loop_control:
        label: "{{ item.item | basename }}"

    - name: Stat restored files
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: ssh_backup_restored
      loop:
        - { path: "{{ ssh_backup_test_dir }}/restore/.ssh/id_rsa", mode: "0600" }
        - { path: "{{ ssh_backup_test_dir }}/restore/.ssh/id_rsa.pub", mode: "0644" }
        - { path: "{{ ssh_backup_test_dir }}/restore/.ssh/config", mode: "0600" }
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Assert restored files exist with expected modes
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.mode == item.item.mode
      loop: "{{ ssh_backup_restored.results }}"
      loop_control:
        label: "{{ item.item.path | basename }}"

    - name: Read restored SSH config
      ansible.builtin.slurp:
        src: "{{ ssh_backup_test_dir }}/restore/.ssh/config"
      register: ssh_backup_config

    - name: Derive public key from restored private key
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -y
          - -f
          - "{{ ssh_backup_test_dir }}/restore/.ssh/id_rsa"
      register: ssh_backup_derived_public_key
      changed_when: false

    - name: Read restored SSH public key
      ansible.builtin.slurp:
        src: "{{ ssh_backup_test_dir }}/restore/.ssh/id_rsa.pub"
      register: ssh_backup_public_key

    - name: Read expected SSH public key
      ansible.builtin.slurp:
        src: "{{ ssh_backup_test_dir }}/expected_id_rsa.pub"
      register: ssh_backup_expected_public_key

    - name: Assert restored key pair matches and config is intact
      ansible.builtin.assert:
        that:
          - ssh_backup_derived_public_key.rc == 0
          - ssh_backup_derived_public_key.stdout.split()[:2] == (ssh_backup_public_key.content | b64decode).split()[:2]
          - (ssh_backup_public_key.content | b64decode).split()[:2] == (ssh_backup_expected_public_key.content | b64decode).split()[:2]
          - "'Host molecule-test' in (ssh_backup_config.content | b64decode)"
          - "'HostName example.com' in (ssh_backup_config.content | b64decode)"
          - "'User molecule' in (ssh_backup_config.content | b64decode)"
        fail_msg: "Restored SSH key pair or config does not match the fixture"
        success_msg: "Restored SSH key pair and config match the fixture"
