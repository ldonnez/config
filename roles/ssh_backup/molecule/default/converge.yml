---
- name: Converge
  hosts: all
  vars:
    ssh_backup_test_dir: /tmp/ssh_backup_test
    ssh_backup_dir: "{{ ssh_backup_test_dir }}/backup/.ssh"
    ssh_backup_vault_password_file_path: "{{ playbook_dir }}/files/password_file.vault"
    ssh_backup_config_path: "{{ ssh_backup_test_dir }}/src/.ssh/config"
    ssh_backup_config_backup_path: "{{ ssh_backup_dir }}/config.vault"
    ssh_backup_keys:
      - name: id_rsa
        private_key_path: "{{ ssh_backup_test_dir }}/src/.ssh/id_rsa"
        public_key_path: "{{ ssh_backup_test_dir }}/src/.ssh/id_rsa.pub"
      - name: id_ed25519
        private_key_path: "{{ ssh_backup_test_dir }}/src/.ssh/id_ed25519"
        public_key_path: "{{ ssh_backup_test_dir }}/src/.ssh/id_ed25519.pub"
  tasks:
    - name: Run ssh_backup role (backup)
      ansible.builtin.include_role:
        name: ssh_backup
        tasks_from: backup.yml

    - name: Check whether the restore test has already run
      ansible.builtin.stat:
        path: "{{ ssh_backup_test_dir }}/restore_test_done"
      register: ssh_backup_restore_marker

    - name: Remove source files to simulate restore target
      when: not ssh_backup_restore_marker.stat.exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ssh_backup_test_dir }}/src/.ssh/id_rsa"
        - "{{ ssh_backup_test_dir }}/src/.ssh/id_rsa.pub"
        - "{{ ssh_backup_test_dir }}/src/.ssh/config"

    - name: Run ssh_backup role (restore)
      ansible.builtin.include_role:
        name: ssh_backup
        tasks_from: restore.yml

    - name: Mark restore test done
      when: not ssh_backup_restore_marker.stat.exists
      ansible.builtin.file:
        path: "{{ ssh_backup_test_dir }}/restore_test_done"
        state: touch
        mode: "0644"

    - name: Test restore skips a missing SSH config backup
      ansible.builtin.include_role:
        name: ssh_backup
        tasks_from: restore.yml
      vars:
        ssh_backup_keys: []
        ssh_backup_config_backup_path: "{{ ssh_backup_test_dir }}/backup/.ssh/missing-config.vault"
        ssh_backup_config_path: "{{ ssh_backup_test_dir }}/src/.ssh/missing-config"
