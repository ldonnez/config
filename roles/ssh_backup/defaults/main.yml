---
# defaults file for ssh_backup

ssh_backup_dir: "{{ secrets_directory }}/.ssh"
ssh_backup_vault_password_file_path: "{{ secrets_directory }}/vault_password_file"
ssh_backup_keys: []
ssh_backup_config_path: "{{ ansible_facts.user_dir }}/.ssh/config"
ssh_backup_config_backup_path: "{{ ssh_backup_dir }}/config.vault"
