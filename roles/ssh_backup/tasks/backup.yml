- name: Secure ssh key backup
  tags:
    - backup
  block:
    - name: Ensure backup dir
      ansible.builtin.file:
        path: "{{ ssh_backup_dir }}"
        state: directory
        recurse: true

    - name: Prepare vault passphrase
      ansible.builtin.import_role:
        name: vault_backup
        tasks_from: prepare.yml
      vars:
        vault_backup_password_file: "{{ ssh_backup_vault_password_file_path }}"

    - name: Encrypt ssh private key
      ansible.builtin.import_role:
        name: vault_backup
        tasks_from: encrypt.yml
      vars:
        vault_backup_source: "{{ ssh_backup_private_key_path }}"
        vault_backup_destination: "{{ ssh_backup_private_key_backup_path }}"

    - name: Encrypt ssh config
      ansible.builtin.import_role:
        name: vault_backup
        tasks_from: encrypt.yml
      vars:
        vault_backup_source: "{{ ssh_backup_config_path }}"
        vault_backup_destination: "{{ ssh_backup_config_backup_path }}"

    - name: Copy public key to backup path
      ansible.builtin.copy:
        src: "{{ ssh_backup_public_key_path }}"
        dest: "{{ ssh_backup_public_key_backup_path }}"
        mode: "0600"

  always:
    - name: Clean up vault passphrase
      ansible.builtin.import_role:
        name: vault_backup
        tasks_from: cleanup.yml
