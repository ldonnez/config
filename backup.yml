---
- name: Backup to SynologyDrive folder
  hosts: localhost
  connection: local

  vars:
    backup_directory: "{{ ansible_facts.user_dir }}/SynologyDrive"
    synchronize_directories:
      - name: "dotfiles"
        src: "{{ ansible_facts.user_dir }}/dotfiles"
        dest: "{{ backup_directory }}"
        delete: true

      - name: "config"
        src: "{{ ansible_facts.user_dir }}/config"
        dest: "{{ backup_directory }}"
        delete: true

      - name: "notes"
        src: "{{ ansible_facts.user_dir }}/notes"
        dest: "{{ backup_directory }}"
        delete: true

      - name: "secrets"
        src: "{{ ansible_facts.user_dir }}/.secrets"
        dest: "{{ backup_directory }}"
        delete: true

      - name: "projects"
        src: "{{ ansible_facts.user_dir }}/projects"
        dest: "{{ backup_directory }}/projects"
        delete: true
        subdirectories: true

  tasks:
    - name: Synchronize directories
      ansible.builtin.import_role:
        name: synchronize
