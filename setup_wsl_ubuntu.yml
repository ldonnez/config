---
- name: Setup WSL Ubuntu
  hosts: "{{ target_hosts | default('localhost') }}"
  connection: "{{ target_connection | default('local') }}"

  vars:
    dotfiles_repo: "https://github.com/ldonnez/dotfiles.git"
    dotfiles_directory_path: "{{ ansible_facts.user_dir }}/dotfiles"

    mise_tools:
      - name: "nodejs"
        apt_dependencies:
          - "libatomic1"
        homebrew_dependencies: []
        versions:
          - latest
        global_version: latest

    lsp_npm:
      - "typescript"
      - "vscode-langservers-extracted"
      - "@fsouza/prettierd"
      - "prettier"
      - "@tailwindcss/language-server"
      - "@prisma/language-server"
      - "yaml-language-server"
      - "graphql-language-service-cli"
      - "@ansible/ansible-language-server"
      - "oxlint"
      - "bash-language-server"
      - "@dont-be-evil-company/kulala-fmt"
      - "@mistweaverco/kulala-ls"
      - "@github/copilot-language-server"
    lsp_cargo:
      - "stylua"
      - "emmylua_ls"
      - "tree-sitter-cli"
    lsp_go:
      - "mvdan.cc/sh/v3/cmd/shfmt"
      - "golang.org/x/tools/gopls"
      - "github.com/golangci/golangci-lint/cmd/golangci-lint"
      - "github.com/nametake/golangci-lint-langserver"
    lsp_pip:
      - "shandy-sqlfmt"

    packages:
      - coreutils
      - build-essential
      - curl
      - htop
      - btop
      - imagemagick
      - jq
      - luarocks
      - tree
      - ninja-build
      - python3-venv
      - clang
      - dnsutils # nslookup
      - gridsite-clients # urlencode

    cargo_packages: []

    pip_packages:
      - ansible-lint

  pre_tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto
      when: ansible_facts.os_family == "Debian"
      tags: always

    - name: Set become_exe for sudo-rs compatibility
      ansible.builtin.set_fact:
        ansible_become_exe: "{{ 'sudo.ws' if 'sudo-rs' in ansible_facts.packages else 'sudo' }}"
      when: ansible_facts.os_family == "Debian"
      tags: always

  tasks:
    - name: Install packages
      ansible.builtin.import_role:
        name: packages
      tags:
        - packages

    - name: Configure wsl
      ansible.builtin.import_role:
        name: wsl
      tags:
        - wsl

    - name: Install dotfiles
      ansible.builtin.import_role:
        name: dotfiles
      tags:
        - dotfiles

    - name: Configure git
      ansible.builtin.import_role:
        name: git
      tags:
        - git

    - name: Configure zsh
      ansible.builtin.import_role:
        name: zsh
      tags:
        - zsh

    - name: Configure atuin
      ansible.builtin.import_role:
        name: atuin
      tags:
        - atuin

    - name: Configure gnupg
      ansible.builtin.import_role:
        name: gnupg
      tags:
        - gnupg

    - name: Configure mise
      ansible.builtin.import_role:
        name: mise
      tags:
        - mise

    - name: Configure golang
      ansible.builtin.import_role:
        name: golang
      tags:
        - golang

    - name: Configure npm
      ansible.builtin.import_role:
        name: npm
      tags:
        - npm

    - name: Configure pip
      ansible.builtin.import_role:
        name: pip
      tags:
        - pip

    - name: Configure rust
      ansible.builtin.import_role:
        name: rust
      tags:
        - rust

    - name: Configure fzf
      ansible.builtin.import_role:
        name: fzf
      tags:
        - fzf

    - name: Configure vifm
      ansible.builtin.import_role:
        name: vifm
      tags:
        - vifm

    - name: Configure vim
      ansible.builtin.import_role:
        name: vim
      tags:
        - vim

    - name: Configure fd
      ansible.builtin.import_role:
        name: fd
      tags:
        - fd

    - name: Configure rg
      ansible.builtin.import_role:
        name: rg
      tags:
        - rg

    - name: Configure memo
      ansible.builtin.import_role:
        name: memo
      tags:
        - memo

    - name: Configure github cli
      ansible.builtin.import_role:
        name: github_cli
      tags:
        - github_cli

    - name: Configure azure cli
      ansible.builtin.import_role:
        name: azure_cli
      tags:
        - azure_cli

    - name: Configure lsp's
      ansible.builtin.import_role:
        name: lsp
      tags:
        - lsp

    - name: Configure terraform
      ansible.builtin.import_role:
        name: terraform
      tags:
        - terraform

    - name: Configure neovim
      ansible.builtin.import_role:
        name: neovim
      tags:
        - neovim

    - name: Configure copilot cli
      ansible.builtin.import_role:
        name: copilot_cli
      tags:
        - copilot_cli

    - name: Configure bat
      ansible.builtin.import_role:
        name: bat
      tags:
        - bat

    - name: Configure ag
      ansible.builtin.import_role:
        name: ag
      tags:
        - ag

    - name: Configure tmux
      ansible.builtin.import_role:
        name: tmux
      tags:
        - tmux
