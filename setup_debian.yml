---
- name: Setup Debian 13
  hosts: localhost
  connection: local

  vars:
    dotfiles_repo: "https://github.com/ldonnez/dotfiles.git"
    dotfiles_directory_path: "{{ ansible_facts.user_dir }}/dotfiles"

    mise_tools:
      - name: "nodejs"
        apt_dependencies:
          - "libatomic1"
        homebrew_dependencies: []
        versions:
          - latest
        global_version: latest

    lsp_npm:
      - "typescript"
      - "vscode-langservers-extracted"
      - "@fsouza/prettierd"
      - "prettier"
      - "@tailwindcss/language-server"
      - "@prisma/language-server"
      - "yaml-language-server"
      - "graphql-language-service-cli"
      - "@ansible/ansible-language-server"
      - "oxlint"
      - "bash-language-server"
      - "@dont-be-evil-company/kulala-fmt"
      - "@mistweaverco/kulala-ls"
      - "@github/copilot-language-server"
    lsp_cargo:
      - "stylua"
      - "emmylua_ls"
      - "tree-sitter-cli"
    lsp_go:
      - "mvdan.cc/sh/v3/cmd/shfmt"
      - "golang.org/x/tools/gopls"
      - "github.com/golangci/golangci-lint/cmd/golangci-lint"
      - "github.com/nametake/golangci-lint-langserver"
    lsp_pip:
      - "shandy-sqlfmt"

    packages:
      - coreutils
      - build-essential
      - htop
      - curl
      - btop
      - imagemagick
      - jq
      - luarocks
      - tree
      - ninja-build
      - python3-venv
      - clang
      - rsync
      - groff
      - vlc
      - thunderbird
      - galculator
      - gparted # Simple program for configuring disk partitioning. Run with root priveleges - sudo gparted.
      - piper # GTK application to configure mouses
      - flameshot # Powerful yet simple-to-use screenshot software
      - zathura # Minimalistic pdf viewer with vim keybindings
      - libreoffice # Full-featured office suite (word, excel, etc...)
      - dnsutils # nslookup
      - gridsite-clients # urlencode

    flatpak_apps:
      - com.github.tchx84.Flatseal # Flatseal is a graphical utility to review and modify permissions from your Flatpak applications.
      - com.bitwarden.desktop
      - com.synology.SynologyDrive
      - org.signal.Signal
      - com.slack.Slack
      - com.github.Matoking.protontricks # Run Winetricks commands for Steam Play/Proton games among other common Wine features, such as launching external Windows executables.
      - com.plexamp.Plexamp
      - org.telegram.desktop

    cargo_packages: []

    pip_packages:
      - ansible-lint

  tasks:
    - name: Install dotfiles
      ansible.builtin.import_role:
        name: dotfiles
      tags:
        - dotfiles

    - name: Configure github cli
      ansible.builtin.import_role:
        name: github_cli
      tags:
        - github_cli

    - name: Configure secrets
      ansible.builtin.import_role:
        name: secrets
      tags:
        - secrets

    - name: Install packages
      ansible.builtin.import_role:
        name: packages
      tags:
        - packages

    - name: Install nvidia
      ansible.builtin.import_role:
        name: nvidia
      tags:
        - nvidia

    - name: Configure git
      ansible.builtin.import_role:
        name: git
      tags:
        - git

    - name: Configure zsh
      ansible.builtin.import_role:
        name: zsh
      tags:
        - zsh

    - name: Configure atuin
      ansible.builtin.import_role:
        name: atuin
      tags:
        - atuin

    - name: Install fonts
      ansible.builtin.import_role:
        name: fonts
      tags:
        - fonts

    - name: Configure gnupg
      ansible.builtin.import_role:
        name: gnupg
      tags:
        - gnupg

    - name: Configure ssh
      ansible.builtin.import_role:
        name: ssh
      tags:
        - ssh

    - name: Configure mise
      ansible.builtin.import_role:
        name: mise
      tags:
        - mise

    - name: Configure golang
      ansible.builtin.import_role:
        name: golang
      tags:
        - golang

    - name: Configure npm
      ansible.builtin.import_role:
        name: npm
      tags:
        - npm

    - name: Configure pip
      ansible.builtin.import_role:
        name: pip
      tags:
        - pip

    - name: Configure rust
      ansible.builtin.import_role:
        name: rust
      tags:
        - rust

    - name: Configure fzf
      ansible.builtin.import_role:
        name: fzf
      tags:
        - fzf

    - name: Configure kitty
      ansible.builtin.import_role:
        name: kitty
      tags:
        - kitty

    - name: Configure vifm
      ansible.builtin.import_role:
        name: vifm
      tags:
        - vifm

    - name: Configure vim
      ansible.builtin.import_role:
        name: vim
      tags:
        - vim

    - name: Configure fd
      ansible.builtin.import_role:
        name: fd
      tags:
        - fd

    - name: Configure gnome keyring
      ansible.builtin.import_role:
        name: gnome_keyring
      tags:
        - gnome_keyring

    - name: Configure rg
      ansible.builtin.import_role:
        name: rg
      tags:
        - rg

    - name: Configure memo
      ansible.builtin.import_role:
        name: memo
      tags:
        - memo

    - name: Configure lsp's
      ansible.builtin.import_role:
        name: lsp
      tags:
        - lsp

    - name: Configure terraform
      ansible.builtin.import_role:
        name: terraform
      tags:
        - terraform

    - name: Configure neovim
      ansible.builtin.import_role:
        name: neovim
      tags:
        - neovim

    - name: Configure bat
      ansible.builtin.import_role:
        name: bat
      tags:
        - bat

    - name: Configure ag
      ansible.builtin.import_role:
        name: ag
      tags:
        - tmux

    - name: Configure libpq
      ansible.builtin.import_role:
        name: libpq
      tags:
        - libpq

    - name: Configure neomutt
      ansible.builtin.import_role:
        name: neomutt
      tags:
        - neomutt

    - name: Install docker desktop
      ansible.builtin.import_role:
        name: docker_desktop
      tags:
        - docker_desktop

    - name: Configure opencode
      ansible.builtin.import_role:
        name: opencode
      tags:
        - opencode

    - name: Configure copilot cli
      ansible.builtin.import_role:
        name: copilot_cli
      tags:
        - copilot_cli

    - name: Configure aws
      ansible.builtin.import_role:
        name: aws
      tags:
        - aws

    - name: Configure azure cli
      ansible.builtin.import_role:
        name: azure_cli
      tags:
        - azure_cli

    - name: Configure firefox
      ansible.builtin.import_role:
        name: firefox
      tags:
        - firefox

    - name: Configure calibre
      ansible.builtin.import_role:
        name: calibre
      tags:
        - calibre

    - name: Configure discord
      ansible.builtin.import_role:
        name: discord
      tags:
        - discord

    - name: Configure spotify
      ansible.builtin.import_role:
        name: spotify
      tags:
        - spotify

    - name: Configure flatpak
      ansible.builtin.import_role:
        name: flatpak
      tags:
        - flatpak

    - name: Configure synology drive
      ansible.builtin.import_role:
        name: synology_drive
      tags:
        - synology_drive

    - name: Configure rofi
      ansible.builtin.import_role:
        name: rofi
      tags:
        - rofi

    - name: Configure i3
      ansible.builtin.import_role:
        name: i3
      tags:
        - i3

    - name: Configure virt manager
      ansible.builtin.import_role:
        name: virt_manager
      tags:
        - virt_manager

    - name: Install steam
      ansible.builtin.import_role:
        name: steam
      tags:
        - steam

    - name: Configure systemd_resolved
      ansible.builtin.import_role:
        name: systemd_resolved
      tags:
        - systemd_resolved
