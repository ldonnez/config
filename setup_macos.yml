---
- name: Setup MacOS
  hosts: localhost
  connection: local

  vars:
    dotfiles_repo: "https://github.com/ldonnez/dotfiles.git"
    dotfiles_directory_path: "{{ ansible_facts.env.HOME }}/dotfiles"

    mise_tools:
      - name: "nodejs"
        apt_dependencies:
          - "libatomic1"
        homebrew_dependencies: []
        versions:
          - latest
        global_version: latest

    lsp_npm:
      - "typescript"
      - "vscode-langservers-extracted"
      - "@fsouza/prettierd"
      - "prettier"
      - "@tailwindcss/language-server"
      - "@prisma/language-server"
      - "yaml-language-server"
      - "graphql-language-service-cli"
      - "@ansible/ansible-language-server"
      - "oxlint"
      - "bash-language-server"
      - "@dont-be-evil-company/kulala-fmt"
      - "@mistweaverco/kulala-ls"
      - "@github/copilot-language-server"
    lsp_cargo:
      - "stylua"
      - "emmylua_ls"
      - "tree-sitter-cli"
    lsp_go:
      - "mvdan.cc/sh/v3/cmd/shfmt"
      - "golang.org/x/tools/gopls"
      - "github.com/golangci/golangci-lint/cmd/golangci-lint"
      - "github.com/nametake/golangci-lint-langserver"
    lsp_pip:
      - "shandy-sqlfmt"

    cargo_packages: []

    pip_packages: []

    packages:
      - coreutils
      - htop
      - btop
      - mosh
      - imagemagick
      - jq
      - go
      - reattach-to-user-namespace
      - luarocks
      - tree
      - ninja
      - mplayer
      - rust
      - python
      - virtualenv
      - mkcert
      - nss
      - sqlcmd
      - awscli

    homebrew_casks:
      - firefox@developer-edition
      - docker
      - rectangle
      - calibre
      - google-chrome
      - signal
      - whatsapp
      - drawio
      - figma
      - dbeaver-community
      - spotify
      - tor-browser
      - zotero
      - telegram
      - bitwarden
      - azure-cli

    mas_apps:
      - name: "Slack for Desktop"
        id: 803453959

      - name: "Amphetamine"
        id: 937984704

      - name: "Apple Developer"
        id: 640199958

      - name: "Xcode"
        id: 497799835

  tasks:
    - name: Install dotfiles
      ansible.builtin.import_role:
        name: dotfiles
      tags:
        - dotfiles

    - name: Configure github cli
      ansible.builtin.import_role:
        name: github_cli
      tags:
        - github_cli

    - name: Configure secrets
      ansible.builtin.import_role:
        name: secrets
      tags:
        - secrets

    - name: Configure preferences
      ansible.builtin.import_role:
        name: preferences
      tags:
        - preferences

    - name: Install packages
      ansible.builtin.import_role:
        name: packages
      tags:
        - packages

    - name: Install fonts
      ansible.builtin.import_role:
        name: fonts
      tags:
        - fonts

    - name: Configure terminal
      ansible.builtin.import_role:
        name: terminal
      tags:
        - terminal

    - name: Install synology drive
      ansible.builtin.import_role:
        name: synology_drive
      tags:
        - synology_drive

    - name: Configure git
      ansible.builtin.import_role:
        name: git
      tags:
        - git

    - name: Configure zsh
      ansible.builtin.import_role:
        name: zsh
      tags:
        - zsh

    - name: Configure atuin
      ansible.builtin.import_role:
        name: atuin
      tags:
        - atuin

    - name: Install terraform
      ansible.builtin.import_role:
        name: terraform
      tags:
        - terraform

    - name: Configure mise
      ansible.builtin.import_role:
        name: mise
      tags:
        - mise

    - name: Configure npm
      ansible.builtin.import_role:
        name: npm
      tags:
        - npm

    - name: Configure pip
      ansible.builtin.import_role:
        name: pip
      tags:
        - pip

    - name: Configure fzf
      ansible.builtin.import_role:
        name: fzf
      tags:
        - fzf

    - name: Configure vim
      ansible.builtin.import_role:
        name: vim
      tags:
        - vim

    - name: Configure lsp's
      ansible.builtin.import_role:
        name: lsp
      tags:
        - lsp

    - name: Configure neovim
      ansible.builtin.import_role:
        name: neovim
      tags:
        - neovim

    - name: Configure opencode
      ansible.builtin.import_role:
        name: opencode
      tags:
        - opencode

    - name: Configure copilot cli
      ansible.builtin.import_role:
        name: copilot_cli
      tags:
        - copilot_cli

    - name: Configure vifm
      ansible.builtin.import_role:
        name: vifm
      tags:
        - vifm

    - name: Configure bat
      ansible.builtin.import_role:
        name: bat
      tags:
        - bat

    - name: Configure tmux
      ansible.builtin.import_role:
        name: tmux
      tags:
        - tmux

    - name: Configure ag
      ansible.builtin.import_role:
        name: ag
      tags:
        - ag

    - name: Configure fd
      ansible.builtin.import_role:
        name: fd
      tags:
        - fd

    - name: Configure rg
      ansible.builtin.import_role:
        name: rg
      tags:
        - rg

    - name: Configure memo
      ansible.builtin.import_role:
        name: memo
      tags:
        - memo

    - name: Configure libpq
      ansible.builtin.import_role:
        name: libpq
      tags:
        - libpq

    - name: Configure gnupg
      ansible.builtin.import_role:
        name: gnupg
      tags:
        - gnupg

    - name: Configure ssh
      ansible.builtin.import_role:
        name: ssh
      tags:
        - ssh

    - name: Configure neomutt
      ansible.builtin.import_role:
        name: neomutt
      tags:
        - neomutt

    - name: Configure kitty
      ansible.builtin.import_role:
        name: kitty
      tags:
        - kitty

    - name: Configure linearmouse
      ansible.builtin.import_role:
        name: linearmouse
      tags:
        - linearmouse

    - name: Install homebrew casks
      ansible.builtin.import_role:
        name: casks
      tags:
        - casks

    - name: Install apps from Mac AppStore
      ansible.builtin.import_role:
        name: mas
      tags:
        - mas
