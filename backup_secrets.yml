---
- name: Backup to secrets repository
  hosts: localhost
  connection: local

  vars:
    secrets_directory: "{{ ansible_facts.user_dir }}/.secrets"
    secrets_repository: "git@github.com:ldonnez/secrets.git"

  tasks:
    - name: Update secrets repository
      ansible.builtin.git:
        repo: "{{ secrets_repository }}"
        dest: "{{ secrets_directory }}"
        version: main
        update: true

    - name: Backup gpg keys
      ansible.builtin.import_role:
        name: gnupg_backup
        tasks_from: backup.yml

    - name: Backup ssh keys and config
      ansible.builtin.import_role:
        name: ssh_backup
        tasks_from: backup.yml

    - name: Backup .mutt-alias
      ansible.builtin.import_role:
        name: neomutt_backup
        tasks_from: backup.yml

    - name: Backup zsh history
      ansible.builtin.import_role:
        name: zsh_history_backup
        tasks_from: backup.yml

    - name: Backup atuin history.db
      ansible.builtin.import_role:
        name: atuin_backup
        tasks_from: backup.yml
