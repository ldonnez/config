---
- name: Backup to secrets repository
  hosts: localhost
  connection: local

  vars:
    secrets_directory: "{{ ansible_facts.user_dir }}/.secrets"
    secrets_repository: "https://github.com/ldonnez/secrets.git"

  pre_tasks:
    - name: Prepare secrets repository
      ansible.builtin.import_role:
        name: secrets
        tasks_from: repository.yml

  tasks:
    - name: Backup GPG keys
      ansible.builtin.import_role:
        name: gnupg_backup
        tasks_from: backup.yml
      vars:
        gnupg_backup_gpg_key_ids:
          - lenny.donnez@gmail.com

    - name: Backup SSH keys and config
      ansible.builtin.import_role:
        name: ssh_backup
        tasks_from: backup.yml
      vars:
        ssh_backup_keys:
          - name: id_rsa
            private_key_path: "{{ ansible_facts.user_dir }}/.ssh/id_rsa"
            public_key_path: "{{ ansible_facts.user_dir }}/.ssh/id_rsa.pub"

    - name: Backup secrets
      ansible.builtin.import_role:
        name: secret_file_backup
        tasks_from: backup.yml
      vars:
        secret_file_backup_items:
          - name: .mutt-alias
            src: "{{ ansible_facts.user_dir }}/.mutt-alias"
            dir: "{{ secrets_directory }}/mutt-alias"
            method: vault
            mode: "0700"
          - name: .zsh_history
            src: "{{ ansible_facts.user_dir }}/.zsh_history"
            dir: "{{ secrets_directory }}/zsh_history/{{ ansible_facts.hostname }}"
            method: gpg
            mode: "0700"

    - name: Backup atuin history.db
      ansible.builtin.import_role:
        name: atuin_backup
        tasks_from: backup.yml

  post_tasks:
    - name: Commit and push backup
      when: not ansible_check_mode
      block:
        - name: Stage secrets repository changes
          ansible.builtin.command:
            argv:
              - git
              - add
              - --all
          args:
            chdir: "{{ secrets_directory }}"
          changed_when: false

        - name: Check for staged changes
          ansible.builtin.command:
            argv:
              - git
              - diff
              - --cached
              - --quiet
          args:
            chdir: "{{ secrets_directory }}"
          register: secrets_backup_changes
          changed_when: false
          failed_when: secrets_backup_changes.rc not in [0, 1]

        - name: Commit backup
          ansible.builtin.command:
            argv:
              - git
              - commit
              - -m
              - Backup secrets
          args:
            chdir: "{{ secrets_directory }}"
          when: secrets_backup_changes.rc == 1

        - name: Push backup
          ansible.builtin.command:
            argv:
              - git
              - push
          args:
            chdir: "{{ secrets_directory }}"
          when: secrets_backup_changes.rc == 1
