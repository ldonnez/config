---
- name: Backup to secrets repository
  hosts: localhost
  connection: local

  vars_files:
    - roles/secrets/defaults/main.yml

  tasks:
    - name: Prepare secrets repository
      ansible.builtin.import_tasks: roles/secrets/tasks/repository.yml

    - name: Backup gpg keys
      ansible.builtin.import_role:
        name: gnupg_backup
        tasks_from: backup.yml

    - name: Backup ssh keys and config
      ansible.builtin.import_role:
        name: ssh_backup
        tasks_from: backup.yml

    - name: Backup .mutt-alias
      ansible.builtin.import_role:
        name: neomutt_backup
        tasks_from: backup.yml

    - name: Backup zsh history
      ansible.builtin.import_role:
        name: zsh_history_backup
        tasks_from: backup.yml

    - name: Backup atuin history.db
      ansible.builtin.import_role:
        name: atuin_backup
        tasks_from: backup.yml
