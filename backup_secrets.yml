---
- name: Backup to secrets repository
  hosts: localhost
  connection: local

  vars_files:
    - roles/secrets/defaults/main.yml

  vars:
    secrets_backup_paths:
      - "{{ gnupg_backup_path | relpath(secrets_directory) }}"
      - "{{ ssh_backup_private_key_backup_path | relpath(secrets_directory) }}"
      - "{{ ssh_backup_config_backup_path | relpath(secrets_directory) }}"
      - "{{ ssh_backup_public_key_backup_path | relpath(secrets_directory) }}"
      - "{{ neomutt_backup_mutt_alias_backup_path | relpath(secrets_directory) }}"
      - "{{ zsh_history_backup_dir | relpath(secrets_directory) }}"
      - "{{ atuin_backup_dir | relpath(secrets_directory) }}"

  tasks:
    - name: Prepare secrets repository
      ansible.builtin.import_tasks: roles/secrets/tasks/repository.yml

    - name: Backup gpg keys
      ansible.builtin.import_role:
        name: gnupg_backup
        tasks_from: backup.yml

    - name: Backup ssh keys and config
      ansible.builtin.import_role:
        name: ssh_backup
        tasks_from: backup.yml

    - name: Backup .mutt-alias
      ansible.builtin.import_role:
        name: neomutt_backup
        tasks_from: backup.yml

    - name: Backup zsh history
      ansible.builtin.import_role:
        name: zsh_history_backup
        tasks_from: backup.yml

    - name: Backup atuin history.db
      ansible.builtin.import_role:
        name: atuin_backup
        tasks_from: backup.yml

    - name: Commit and push backup artifacts
      ansible.builtin.import_tasks: roles/secrets/tasks/commit.yml
