name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
        with:
          requirements_file: "requirements.yml"
      - name: Run syntax check
        run: ansible-playbook --syntax-check backup.yml backup_secrets.yml restore_secrets.yml setup_debian.yml setup_macos.yml setup_wsl_ubuntu.yml

  molecule:
    needs: ansible-lint
    name: molecule
    runs-on: ubuntu-latest
    env:
      DOCKER_TIMEOUT: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule "molecule-plugins[docker]"
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Run molecule
        run: molecule test --all --exclude default
