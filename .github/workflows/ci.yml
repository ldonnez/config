name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

jobs:
  prettier:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install prettier
        run: npm install --global prettier
      - name: Check formatting
        run: prettier --check .

  ansible-lint:
    needs: prettier
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
        with:
          requirements_file: "requirements.yml"
      - name: Run syntax check
        run: ansible-playbook --syntax-check backup.yml backup_secrets.yml restore_secrets.yml setup_debian.yml setup_macos.yml setup_wsl_ubuntu.yml

  changes:
    needs: ansible-lint
    if: github.event_name != 'workflow_dispatch'
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      roles: ${{ steps.result.outputs.roles }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: json
          filters: |
            roles:
              - 'roles/**'

      - name: Determine changed roles
        id: result
        shell: bash
        env:
          ROLE_FILES: ${{ steps.filter.outputs.roles_files }}
        run: |
          roles=$(
            jq -r '.[] | select(startswith("roles/")) | split("/")[1]' <<< "$ROLE_FILES" |
            sort -u |
            while IFS= read -r role; do
              [[ -f "roles/$role/molecule/default/molecule.yml" ]] && echo "$role"
            done |
            xargs
          )

          echo "roles=$roles" >> "$GITHUB_OUTPUT"

  molecule-role-tests:
    needs:
      - ansible-lint
      - changes
    if: >-
      always() &&
      needs.ansible-lint.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.roles != '')
      )
    name: molecule role tests
    runs-on: ubuntu-latest
    env:
      DOCKER_TIMEOUT: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: docker/setup-buildx-action@v4

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule "molecule-plugins[docker]"

      - name: Run Molecule tests
        env:
          ROLES: ${{ needs.changes.outputs.roles }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make test-roles ROLES="$ROLES"
