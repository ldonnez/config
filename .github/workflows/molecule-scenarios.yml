name: Molecule Scenarios

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Molecule scenario to run"
        required: true
        default: wsl_ubuntu
        type: choice
        options:
          - wsl_ubuntu
          - debian
          - macos
  schedule:
    - cron: "0 6 * * 1"

run-name: Scenario (${{ github.event_name == 'schedule' && 'wsl_ubuntu' || inputs.scenario }})

jobs:
  molecule:
    name: (${{ github.event_name == 'schedule' && 'wsl_ubuntu' || inputs.scenario }})
    runs-on: ${{ inputs.scenario == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    env:
      DOCKER_TIMEOUT: 300
      SCENARIO: ${{ github.event_name == 'schedule' && 'wsl_ubuntu' || inputs.scenario }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: docker/setup-buildx-action@v4
        if: env.SCENARIO != 'macos'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule
          if [ "$SCENARIO" != macos ]; then pip install "molecule-plugins[docker]"; fi
          ansible-galaxy collection install -r requirements.yml

      - name: Run molecule scenario test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$SCENARIO" = macos ]; then
            molecule test -s macos
          else
            make test-scenarios SCENARIO="$SCENARIO"
          fi
