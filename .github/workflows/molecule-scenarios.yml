name: Molecule scenarios

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Molecule scenario to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - wsl_ubuntu
          - debian
          - macos
  schedule:
    - cron: "0 2 * * 0"

run-name: Molecule ${{ github.event_name == 'schedule' && 'all' || inputs.scenario }}

jobs:
  molecule:
    name: ${{ matrix.scenario }}
    runs-on: ${{ matrix.scenario == 'macos' && 'macos-latest' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(github.event_name == 'schedule' && '["wsl_ubuntu","debian","macos"]' || inputs.scenario == 'all' && '["wsl_ubuntu","debian","macos"]' || format('["{0}"]', inputs.scenario)) }}

    env:
      DOCKER_TIMEOUT: 300
      SCENARIO: ${{ matrix.scenario }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: docker/setup-buildx-action@v4
        if: matrix.scenario != 'macos'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule
          if [ "$SCENARIO" != macos ]; then
            pip install "molecule-plugins[docker]"
          fi
          ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule scenario test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$SCENARIO" = macos ]; then
            molecule test -s macos
          else
            make test-scenarios SCENARIO="$SCENARIO"
          fi
