name: Molecule Scenarios

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Molecule scenario to run"
        required: true
        default: wsl_ubuntu
        type: choice
        options:
          - wsl_ubuntu
  schedule:
    - cron: "0 6 * * 1"

jobs:
  molecule:
    name: molecule
    runs-on: ubuntu-latest
    env:
      DOCKER_TIMEOUT: 300
      SCENARIO: ${{ github.event_name == 'schedule' && 'wsl_ubuntu' || inputs.scenario }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: docker/setup-buildx-action@v4
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule "molecule-plugins[docker]"

      - name: Run molecule scenario test
        run: make test-scenarios SCENARIO="${SCENARIO}"
